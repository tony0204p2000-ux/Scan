<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24292f">
<title>工單點交核對（手機版）</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1f2328; --sub:#656d76; --line:#d0d7de; --soft:#eaeef2;
    --accent:#1f6feb; --accent-weak:#e7f0ff;
    --ok:#1a7f37; --ok-weak:#dafbe1; --warn:#9a6700; --warn-weak:#fff8c5;
    --danger:#cf222e; --danger-weak:#ffebe9;
    --barH:68px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:15px;
    overscroll-behavior:none}
  header{position:sticky;top:0;z-index:20;background:#24292f;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1}
  .steps{display:flex;gap:4px}
  .steps span{font-size:12px;padding:3px 9px;border-radius:12px;background:#3a4048;color:#c9d1d9}
  .steps span.on{background:#58a6ff;color:#0d1117;font-weight:700}
  .screen{display:none;padding:12px 12px calc(var(--barH) + 20px + env(safe-area-inset-bottom))}
  .screen.on{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .muted{color:var(--sub)}
  .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px}
  .tag.c{background:var(--danger-weak);color:var(--danger)}
  .tag.w{background:var(--warn-weak);color:var(--warn)}
  .tag.o{background:var(--ok-weak);color:var(--ok)}
  button{font:inherit;border:none;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:15px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.danger{color:var(--danger)}
  .btn:disabled{opacity:.45}
  .bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
  .bottom .btn{flex:1;padding:13px 10px}
  .bottom .btn.wide{flex:2}

  /* ----- 載入 ----- */
  .pick{display:block;text-align:center;padding:26px 16px;border:2px dashed var(--line);background:var(--card);border-radius:12px;color:var(--accent);font-weight:600;font-size:16px}
  .pick small{display:block;color:var(--sub);font-weight:400;font-size:13px;margin-top:4px}
  .fmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub);margin:14px 2px 8px}
  .fmeta b{color:var(--ink)}
  .wo{padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .wo .info{flex:1;min-width:0}
  .wo .t1{font-weight:700;font-size:15px}
  .wo .t2{font-size:13px;color:var(--sub);margin-top:3px}
  .wo .t3{font-size:13px;margin-top:3px;word-break:break-all}
  .wo .qty{font-size:22px;font-weight:700;text-align:right;min-width:40px}
  .wo .qty small{display:block;font-size:11px;color:var(--sub);font-weight:400}
  .wo.cancel{opacity:.5}
  .wo.cancel .t1{text-decoration:line-through}
  .wo .tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--danger)}
  .wo.cancel .tg{color:var(--ok)}
  .summary-line{font-size:14px;margin:6px 2px 10px}

  /* ----- 掃描 ----- */
  .cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1/1;max-height:52vh;margin:0 auto}
  .cam video{width:100%;height:100%;object-fit:cover;display:block}
  .cam .frame{position:absolute;left:5%;top:8%;width:90%;height:84%;border:3px solid rgba(255,255,255,.9);border-radius:10px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  .cam .frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(255,80,80,.85);animation:scanline 1.6s ease-in-out infinite}
  @keyframes scanline{0%,100%{transform:translateY(-34px)}50%{transform:translateY(34px)}}
  .cam .camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;font-size:15px;background:rgba(0,0,0,.6)}
  .cam .paused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;display:none}
  .cam.pause .paused{display:block}
  .cam.pause .frame::after{animation:none;opacity:0}
  .cam.hit .frame{border-color:#2ea043}
  .cam.bad .frame{border-color:#f85149}
  .prog{display:flex;align-items:center;gap:10px;margin:12px 2px 8px}
  .prog .num{font-size:24px;font-weight:700}
  .prog .num small{font-size:14px;color:var(--sub);font-weight:400}
  .prog .bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
  .pend{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:stretch}
  .pend .no{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;font-size:12px;color:var(--sub)}
  .pend .no b{display:block;font-size:22px;color:var(--ink)}
  .pend .box{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card)}
  .pend .box .k{font-size:12px;color:var(--sub)}
  .pend .box .v{font-size:22px;font-weight:700;font-family:Consolas,monospace}
  .pend .box.need{border-color:var(--accent);background:var(--accent-weak)}
  .pend .box.filled{border-color:var(--ok);background:var(--ok-weak)}
  .last{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--soft);font-size:14px}
  .last.ok{background:var(--ok-weak);color:var(--ok)}
  .last.warn{background:var(--warn-weak);color:var(--warn)}
  .last.err{background:var(--danger-weak);color:var(--danger)}
  .tools{display:flex;gap:8px;margin-top:10px}
  .tools .btn{flex:1;padding:9px 4px;font-size:14px;white-space:nowrap}
  details.card{margin-top:10px}
  details.card summary{padding:11px 14px;font-weight:600;font-size:14px}
  .plist{padding:0 14px 10px}
  .plist .row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--soft);font-size:13px}
  .plist .row.done{color:var(--ok)}

  .camctl{display:flex;align-items:center;gap:10px;margin-top:8px}
  .chips{display:flex;gap:6px}
  .chips button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;color:var(--sub)}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .zoom{flex:1;display:flex;align-items:center;gap:6px;font-size:14px}
  .zoom input{flex:1}
  .cam .torch{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:20px}
  .cam .torch.on{background:#f5c518}
  .cam .frame{transition:all .2s}
  .pend{grid-template-columns:auto 1fr 1.6fr!important}
  .pend .box .v{font-size:18px!important;word-break:break-all}
  .pend .box.opt{border-style:dashed}
  .elist{margin:6px 0;padding-left:20px}
  .elist li{margin:4px 0}
  .plist label.row{align-items:center}
  .plist input[type=checkbox]{width:22px;height:22px}
  .rtitle{font-size:16px;font-weight:700;margin:2px 2px 10px}
  .vhead .vst{display:flex;align-items:center;gap:8px;flex:1 1 100%;margin-top:2px}
  .vhead .vst .tag{font-size:12px}
  .vhead .rbtn{border:1px solid #57606a;background:#fff;color:#24292f;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600}
  .pullhead{background:var(--danger);color:#fff;font-weight:700;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:16px}
  .pull{font-size:20px;font-weight:700;font-family:Consolas,monospace;color:var(--danger)}
  .rrow.ihead{background:#fafbfc}
  .i-nolot .a span:first-child,.i-extra .a span:first-child{color:var(--danger)}
  .i-short .a span:first-child,.i-unscanned .a span:first-child{color:var(--warn)}
  .vcard{margin:14px 0 6px}
  .vcard .vbody{display:none} .vcard.open .vbody{display:block}
  .vhead{cursor:pointer}
  .vhead .vname{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .vhead .vpm{flex:none;border:1px solid #57606a;background:transparent;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:400;line-height:normal}
  .vhead{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 2px 8px;padding:10px 12px;background:#24292f;color:#fff;border-radius:10px}
  .vhead .vname{font-weight:700;font-size:15px;flex:1 1 100%}
  .vhead .vmeta{font-size:12px;color:#c9d1d9;flex:1}
  .vhead .vmeta b{color:#fff}
  .vhead .tg{border:1px solid #57606a;background:transparent;color:#ff8182;border-radius:8px;padding:4px 10px;font-size:12px}
  .vbar{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-size:14px;color:var(--sub)}
  .vbar b{color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbar .tg{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
  .sheet.vpick .sf{flex-direction:column}
  .sheet.vpick .sf .btn{text-align:left}
  .bc{display:flex;gap:8px;margin:12px 0 0}
  .bk{display:flex;gap:8px;margin:10px 0 0}
  .bk .btn{flex:1;padding:9px 6px;font-size:14px;text-align:center;cursor:pointer}
  .bc input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
  .bc .btn{padding:9px 14px;color:var(--danger)}
  .clist{max-height:40vh;overflow:auto;margin-top:8px;font-family:Consolas,monospace;font-size:13px;line-height:1.7}
  .row.voided span:first-child{color:#a0a7b0;text-decoration:line-through}
  .vbtn-s{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:12px;color:var(--danger);margin-left:4px}
  /* ----- 視窗 ----- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-end;justify-content:center}
  .mask.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .sh{padding:16px 18px;font-size:19px;font-weight:700;border-radius:16px 16px 0 0}
  .sheet.warn .sh{background:var(--warn-weak);color:var(--warn)}
  .sheet.err .sh{background:var(--danger-weak);color:var(--danger)}
  .sheet.ok .sh{background:var(--ok-weak);color:var(--ok)}
  .sheet.plain .sh{background:var(--soft)}
  .sheet .sb{padding:14px 18px;line-height:1.7}
  .sheet .sb .big{font-size:22px;font-weight:700;font-family:Consolas,monospace}
  .sheet .sf{display:flex;gap:8px;padding:6px 18px 16px}
  .sheet .sf .btn{flex:1;padding:14px}
  .sheet input{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px;font-family:Consolas,monospace;text-transform:uppercase}

  /* ----- 結果 ----- */
  .verdict{padding:14px 16px;font-weight:700;font-size:16px;margin-bottom:10px}
  .verdict.ok{background:var(--ok-weak);color:var(--ok);border-color:#aceebb}
  .verdict.ng{background:var(--warn-weak);color:var(--warn);border-color:#eed888}
  .rsec{margin-bottom:10px;overflow:hidden}
  .rsec h3{font-size:14px;margin:0;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line)}
  .rrow{padding:10px 14px;border-top:1px solid var(--soft);font-size:14px}
  .rrow:first-of-type{border-top:none}
  .rrow .a{display:flex;justify-content:space-between;gap:8px;font-weight:600}
  .rrow .b{color:var(--sub);font-size:13px;margin-top:2px;word-break:break-all}
  .plus{color:var(--danger)} .minus{color:var(--warn)} .zero{color:var(--ok)}
  .lots{margin-top:6px;font-size:13px;background:#fafbfc;border-radius:8px;padding:6px 8px}
  .lotline{margin:2px 0;word-break:break-all} .lotline .minus,.lotline .plus{font-weight:600}
  .none{padding:16px;text-align:center;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header>
  <h1>工單點交核對</h1>
  <div class="steps"><span data-s="load" class="on">1 工單</span><span data-s="scan">2 掃描</span><span data-s="result">3 結果</span></div>
</header>

<!-- 1 工單 -->
<section class="screen on" id="sc-load">
  <label class="pick" for="fileInput">＋ 上傳委外加工送貨單-ZRSUB019<small>可一次選多個檔案</small></label>
  <input id="fileInput" type="file" accept=".txt,.xlsx,.xlsm,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple hidden>
  <div class="appVer" style="text-align:right;font-size:12px;color:#8c959f;margin:4px 2px 0"></div>
  <div id="loadMsg" class="muted" style="color:var(--danger);font-size:13px;margin-top:6px"></div>
  <div class="bk"><button class="btn" id="bkSave" type="button">💾 備份進度</button><label class="btn" for="bkFile">📂 還原進度</label>
    <input id="bkFile" type="file" accept=".json,application/json" hidden></div>
  <div class="bc" id="bcBox" hidden><input id="bcInput" placeholder="批次取消整張工單：R026A00656 或 656" autocomplete="off" autocapitalize="characters"><button class="btn" id="bcBtn">取消</button></div>
  <div id="woList"></div>
</section>

<!-- 2 掃描 -->
<section class="screen" id="sc-scan">
  <div class="vbar">核對廠商：<b class="curV"></b><button class="tg" id="switchV">切換</button></div>
  <div class="cam" id="cam">
    <video id="video" playsinline muted></video>
    <div class="frame"></div>
    <div class="paused">已暫停，點畫面繼續</div>
    <div class="camMsg" id="camMsg">相機啟動中…</div>
    <button class="torch" id="torchBtn" hidden>🔦</button>
  </div>
  <div class="camctl">
    <div class="chips" id="frameChips">
      <button data-f="code" class="on">條碼區</button><button data-f="label">整張標籤</button><button data-f="bar">橫條</button>
    </div>
    <label class="zoom" id="zoomBox" hidden>🔍<input type="range" id="zoom" min="1" max="1" step="0.1" value="1"></label>
  </div>
  <div class="prog"><div class="num" id="pNum">0 <small>/ 0</small></div><div class="bar"><i id="pBar"></i></div></div>
  <div class="pend">
    <div class="no">第<b id="wNo">1</b>顆</div>
    <div class="box" id="boxLot"><div class="k">批號 LOT NO</div><div class="v" id="vLot">—</div></div>
    <div class="box" id="boxWf"><div class="k">刻號 WF ID</div><div class="v" id="vWf">—</div></div>
  </div>
  <div class="last" id="last">把標籤右側的「條碼 + QR Code」區塊放進框內，盡量填滿框</div>
  <div class="tools">
    <button class="btn" id="undoBtn">↶ 復原</button>
    <button class="btn" id="clearBtn" style="color:var(--danger)">🗑 清除</button>
    <button class="btn" id="manualBtn">⌨ 手動</button>
    <button class="btn" id="pauseBtn">⏸ 暫停</button>
  </div>
  <details class="card"><summary>刷讀順序 <span class="muted" id="boxSum"></span></summary><div class="plist" id="boxList"></div></details>
  <details class="card"><summary>工單進度 <span class="muted" id="progSum"></span></summary><div class="plist" id="progList"></div></details>
  <details class="card"><summary>錯誤紀錄 <span class="muted" id="errSum"></span></summary><div class="plist" id="errList"></div></details>
  <details class="card"><summary>設定</summary><div class="plist">
    <label class="row"><span>音效</span><input type="checkbox" id="optSound"></label>
    <label class="row"><span>震動（錯誤時）</span><input type="checkbox" id="optVib"></label>
    <label class="row"><span>鏡頭</span><select id="optCam" style="max-width:62%;font-size:14px"><option value="auto">自動（建議）</option></select></label>
    <div class="row muted" style="font-size:12px">iPhone 讀不到 LOT NO 時，可試試「後置三鏡頭相機」或「後置雙鏡頭相機」，近距離較清楚</div>
  </div></details>
</section>

<!-- 3 結果 -->
<section class="screen" id="sc-result">
  <div class="rtitle curV"></div>
  <div id="resContent"></div>
</section>

<div class="bottom" id="bottom"></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"><div class="sh" id="sTitle"></div><div class="sb" id="sBody"></div><div class="sf" id="sFoot"></div></div></div>
<canvas id="cv" hidden></canvas>

<script>
/* ===== 共用核心（電腦版與手機版共用，修改後執行 build.py 同步兩個版本） ===== */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 讀檔：先試 UTF-8，失敗改 Big5 ---------- */
function decodeText(buf){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf).replace(/^﻿/, ''); }
  catch(e){ return new TextDecoder('big5').decode(buf); }
}

/* ---------- 解析加工單 ---------- */
function sepSpans(line){
  const spans = []; const re = /-+/g; let m;
  while((m = re.exec(line))) spans.push([m.index, m.index + m[0].length]);
  return spans;
}
function cut(row, span){ return span ? row.substring(span[0], span[1]).trim() : ''; }

function parseWorkOrder(text, name){
  const lines = text.split(/\r?\n/);
  const out = {name, vendor:'', printDate:'', records:[]};
  let spans = null, cur = null;
  for(let i=0;i<lines.length;i++){
    const line = lines[i]; let m;
    if(!out.vendor && (m = line.match(/^\s*廠\s*商\s*[:：]\s*(.+?)\s*$/))) { out.vendor = normVendor(m[1]); continue; }
    if(!out.printDate && (m = line.match(/列印日期\s*[:：]\s*(\S+)/))) out.printDate = m[1];
    if(/^-+(\s+-+){3,}\s*$/.test(line) && i>0 && /工單/.test(lines[i-1]) && /料號/.test(lines[i-1])){
      spans = sepSpans(line); continue;
    }
    if(spans && /^\S+-\d+\s/.test(line)){
      const r1 = line, r2 = lines[i+1] || '';
      cur = { wo:cut(r1,spans[0]), part:cut(r2,spans[1]), lot:cut(r2,spans[2]),
              plant:cut(r2,spans[3]), qty:cut(r2,spans[5]), wafers:[], cancel:false };
      if(!cur.part || !cur.lot){
        const t = r2.trim().split(/\s+/);
        if(t[0] && t[0].startsWith('(')) t.shift();
        cur.part = cur.part || t[0] || ''; cur.lot = cur.lot || t[1] || '';
        cur.plant = cur.plant || t[2] || ''; cur.qty = cur.qty || t[3] || '';
      }
      const q = parseFloat(cur.qty); if(!isNaN(q)) cur.qty = q;
      out.records.push(cur); i++; continue;
    }
    if(!cur) continue;
    if((m = line.match(/^(.*?)\s*Fab批號\s*[:：]\s*(.*?)\s*$/))){
      cur.wafers.push({die:m[1].trim(), fab:m[2], slots:''}); continue;
    }
    if((m = line.match(/^(.*?)\s*刻號\s*[:：]\s*(.*?)\s*$/))){
      const die = m[1].trim();
      let w = cur.wafers.find(x => x.die === die && !x.slots) || cur.wafers[cur.wafers.length-1];
      if(!w){ w = {die, fab:'', slots:''}; cur.wafers.push(w); }
      w.slots = m[2];
    }
  }
  // 只保留領料廠為 RT2 的工單
  const all = out.records.length;
  out.records = out.records.filter(r => String(r.plant).trim().toUpperCase() === 'RT2');
  out.excluded = all - out.records.length; out.kind = '加工單';
  return out;
}

/* ---------- 讀取 Excel（.xlsx）：不需外部函式庫，用瀏覽器內建解壓縮 ---------- */
async function unzipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let eocd = -1;

  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {};
  for(let k=0;k<count;k++){
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);

    const f = files[name]; if(!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.csize);

function excelDate(v){

/* WF 出貨單（1024）：撈出領料庫位 = WF 且領料廠 = RT2 的資料 */
function parseShipXlsx(sheets, name){
  const need = ['委外採購單號','委外採購單項次','領料庫位','領料廠','領料料號','領料批號','領料Wafer ID'];
  let best = null;
  sheets.forEach(sh => {
    const head = (sh.rows[0] || []).map(x => String(x == null ? '' : x).trim());
    if(!need.every(k => head.includes(k))) return;
    const data = sh.rows.slice(1).filter(r => r && r[head.indexOf('領料批號')]);
    if(!best || data.length > best.data.length) best = {head, data};
  });
  // 同一份出貨單可能包含多家廠商：依「供應商」拆成各自一份
  const outs = new Map(); let excluded = 0;
  // 同廠商不同開單日期也分開
  const outOf = (v, d) => { const k = v + '｜' + d; if(!outs.has(k)) outs.set(k, {name:name + '｜' + k, src:name, vendor:v, printDate:d, records:[], excluded:0, kind:'WF出貨單'}); return outs.get(k); };
  if(!best) return [{name, src:name, vendor:'', printDate:'', records:[], excluded:0, kind:'WF出貨單'}];
  const col = k => best.head.indexOf(k), get = (r, k) => { const i = col(k); return i < 0 || r[i] == null ? '' : r[i]; };
  const up = v => String(v).trim().toUpperCase();
  best.data.forEach(r => {
    if(up(get(r, '領料庫位')) !== 'WF' || up(get(r, '領料廠')) !== 'RT2'){ excluded++; return; }
    const out = outOf(normVendor(get(r, '供應商')), excelDate(get(r, '開單日期')));
    const item = String(get(r, '委外採購單項次')).trim().replace(/\.0+$/, '');
    const wid = get(r, '領料Wafer ID');
    const slots = (typeof wid === 'number' ? [wid] : String(wid).split(/[,，;\/\s]+/)).filter(x => x !== '' && !isNaN(parseInt(x, 10))).map(x => pad2(parseInt(x, 10)));
    const fab = String(get(r, '領料Fab批號')).trim();
    const q = parseFloat(get(r, '刻號數'));
    out.records.push({wo:String(get(r, '委外採購單號')).trim() + '-' + item, part:String(get(r, '領料料號')).trim(), lot:up(get(r, '領料批號')),
      plant:'RT2', qty:isNaN(q) ? slots.length : q, wafers:[{die:'', fab, slots:slots.join(',')}], cancel:false});
  });
  const list = [...outs.values()];
  if(!list.length) return [{name, src:name, vendor:'', printDate:'', records:[], excluded, kind:'WF出貨單'}];
  list[0].excluded = excluded;
  return list;
}
/* 依副檔名讀取：.txt 加工單 / .xlsx WF 出貨單（回傳陣列：出貨單會依廠商拆成多份） */
async function parseAnyFile(file){
  const buf = await file.arrayBuffer();
  if(/\.xls[xm]$/i.test(file.name)) return parseShipXlsx(await readXlsx(buf), file.name);
  if(/\.xls$/i.test(file.name)) return [{name:file.name, src:file.name, vendor:'', printDate:'', records:[], excluded:0, error:'舊版 .xls 格式無法讀取，請在 Excel 另存為 .xlsx'}];
  const p = parseWorkOrder(decodeText(buf), file.name); p.src = file.name;
  return [p];
}

/* ---------- 刻號工具 ---------- */
const splitSlots = s => String(s||'').split(/[,，\s]+/).filter(Boolean);
const pad2 = n => String(n).padStart(2,'0');
function compress(list){
  const items = Array.isArray(list) ? list : splitSlots(list);
  if(!items.length) return '';
  const nums = items.map(x => ({t:x, n:parseInt(x,10)}));
  if(nums.some(x => isNaN(x.n))) return items.join(', ');
  nums.sort((a,b) => a.n - b.n);
  const parts = []; let st = nums[0], pv = nums[0];
  for(let k=1;k<=nums.length;k++){
    const c = nums[k];
    if(c && c.n === pv.n + 1){ pv = c; continue; }
    parts.push(st === pv ? st.t : st.t + '-' + pv.t);
    st = pv = c;
  }
  return parts.join(', ');
}
const fabText  = r => r.wafers.map(w => w.fab).filter(Boolean).join(' / ');
const slotText = r => r.wafers.map(w => compress(w.slots)).filter(Boolean).join(' / ');
function qtyMismatch(r){
  if(typeof r.qty !== 'number' || r.wafers.length !== 1) return false;
  return splitSlots(r.wafers[0].slots).length !== r.qty;
}

/* ---------- 條碼格式判斷 ----------
   Wafer 顆標籤：
     LOT NO（一維條碼）：5 碼英數混合，例：Q7J99            → 批號
     WF ID （QR Code）：刻號清單，例：01/02/03/…/25         → 刻號（整顆一次登記）
     QTY   （一維條碼）：不需刷，片數直接用 WF ID 刻號數計算
     STOCK NO / ITEM NO：不需刷，刷到視為格式錯誤
   fmt：'qr' 或 '1d'（手機知道條碼類型），電腦版條碼槍不知道類型時為 undefined   */
function toHalfWidth(s){
  return String(s||'').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/　/g, ' ');
}
function parseWfList(v){
  const t = v.replace(/[;,?，；？\\|]/g, '/').replace(/\s+/g, '').replace(/\/+$/, '');
  if(!/^\d{1,2}(\/\d{1,2})*$/.test(t)) return null;
  const list = t.split('/').map(x => +x);
  if(list.some(n => n < 1 || n > 25)) return null;
  return list.map(pad2);
}
function classifyCode(raw, fmt){
  const src = String(raw||'');
  if(/[㄀-ㄯˇˊˋ˙]/.test(src)) return {type:'ime', value:src.trim()};
  const v = toHalfWidth(src).trim().toUpperCase();
  if(/^[A-Z0-9]{5}$/.test(v) && /[A-Z]/.test(v) && /\d/.test(v)) return {type:'lot', value:v};
  if(/^\d{1,3}$/.test(v)){
    const n = +v;
    if(fmt === '1d') return {type:'qty', value:n};   // 手機讀到的一維數字條碼是 QTY，不需比對，直接忽略
    if(n >= 1 && n <= 25) return {type:'wf', value:[pad2(n)], single:true};   // 單片顆
    return {type:null, value:v};
  }
  if(/[\/;,?]/.test(v) && fmt !== '1d'){ const l = parseWfList(v); if(l) return {type:'wf', value:l}; }
  return {type:null, value:v};
}
/* 格式錯誤的原因說明（防誤刷：不符格式一律不寫入，只提示重刷） */
function badCodeReason(v){
  v = toHalfWidth(v).trim().toUpperCase();
  if(!v) return '空白內容';
  if(/^\d+$/.test(v)) return +v > 25 ? `純數字 ${v}：不是批號（批號須英數混合），也不是刻號（01~25）` : '純數字：批號須英數混合';
  if(/[\/;,?]/.test(v)) return '刻號清單格式錯誤（只能是 01~25，以 / 分隔）';
  if(/[^A-Z0-9]/.test(v)) return `含符號或空白（${[...new Set(v.replace(/[A-Z0-9]/g,''))].join(' ')}）：批號只能是英文和數字`;
  if(v.length !== 5) return /^[A-Z0-9]+$/.test(v) && /[A-Z]/.test(v) && /\d/.test(v) && v.length <= 8
    ? `長度 ${v.length} 碼：批號須為 5 碼英數字。可能刷到料號（ITEM NO / STOCK NO）條碼，請改刷 LOT NO 條碼`
    : `長度 ${v.length} 碼：批號須為 5 碼`;
  if(/^[A-Z]+$/.test(v)) return '只有英文：批號須英數混合';
  return '不符批號格式';
}
/* 給「手動輸入」與舊介面用 */
function classify(raw){
  const c = classifyCode(raw);
  if(c.type === 'wf' && c.single) return {type:'slot', value:c.value[0]};
  return c;
}

/* ---------- 核對資料庫 ---------- */
function buildDb(files){
  const byLot = new Map(), byLotCancel = new Map(), records = [];
  const add = (map, k, rec) => { if(!map.has(k)) map.set(k, []); const a = map.get(k); if(!a.includes(rec)) a.push(rec); };
  files.forEach(f => f.records.forEach(r => {
    const slots = []; r.wafers.forEach(w => splitSlots(w.slots).forEach(s => { const n = parseInt(s,10); if(!isNaN(n)) slots.push(pad2(n)); }));
    const rec = {wo:r.wo, part:r.part, lot:String(r.lot).toUpperCase(), fab:fabText(r), slots, vendor:f.vendor};
    // 同一批號可能拆在多張工單（不同項次或不同產品），一個批號對應多筆工單
    const map = r.cancel ? byLotCancel : byLot;
    if(!r.cancel) records.push(rec);
    add(map, rec.lot, rec);
  }));
  // 應刷 Wafer 以「批號 + 刻號」不重複計算：同一片 Wafer 出現在多個項次（例如同一片供多個產品使用），實物只有一片，刷一次即可
  const need = new Map();
  records.forEach(r => r.slots.forEach(sl => { const k = r.lot + '|' + sl; if(!need.has(k)) need.set(k, {lot:r.lot, slot:sl, part:r.part, wos:[]}); need.get(k).wos.push(r.wo); }));
  return {byLot, byLotCancel, records, need, expected:need.size};
}

/* status：ok 正確 / noslot 刻號不在工單 / nolot 批號不在工單 / cancelled 屬於已取消工單 / dup 重複刷讀（不計入實刷） */
const STATUS_TEXT = {ok:'正確', noslot:'刻號不在工單', nolot:'批號不在工單', cancelled:'屬於已取消工單', dup:'重複刷讀', overlap:'刻號重複（標籤異常）', qty:'QTY與WF ID片數不符'};

/* 每片 Wafer 以「批號 + 刻號」比對，自動對到含有該刻號的工單 */
function evaluate(db, scans, lot, slot){
  const recs = db.byLot.get(lot) || [];
  const cands = recs.filter(r => r.slots.includes(slot));
  if(cands.length){
    const woText = [...new Set(cands.map(r => r.wo))].join(' / ');
    if(scans.some(s => s.status === 'ok' && s.lot === lot && s.slot === slot)) return {status:'dup', woText, partText:cands[0].part};
    return {status:'ok', woText, partText:cands[0].part};
  }
  // 有問題的 Wafer 不管刷幾次，都顯示真正的錯誤原因（不會變成「重複刷讀」）
  const can = (db.byLotCancel.get(lot) || []).filter(r => r.slots.includes(slot));
  if(can.length) return {status:'cancelled', woText:can.map(r => r.wo).join(' / '), partText:can[0].part};
  if(!recs.length) return {status:'nolot', woText:'', partText:''};
  const parts = [...new Set(recs.map(r => r.part))];
  return {status:'noslot', woText:recs.map(r => r.wo).join(' / '), partText:parts[0]};
}

/* boxes：[{b, lot, slots:[...], qty, time}] —— 每次刷完一張顆標籤記一筆，刷讀明細由它推算 */
function deriveScans(db, boxes){
  const scans = [];
  boxes.forEach(bx => { if(bx.void) return; bx.slots.forEach(slot => {
    const ev = evaluate(db, scans, bx.lot, slot);
    let status = ev.status, dupOf = null;
    // 同一刻號出現在兩顆（不是整顆重刷）：每片刻號是唯一的，代表其中一顆標籤刻號錯誤
    if(status === 'dup'){ status = 'overlap'; const p = scans.find(x => x.lot === bx.lot && x.slot === slot && x.status === 'ok'); dupOf = p ? p.b : null; }
    scans.push({n:scans.length + 1, b:bx.b, lot:bx.lot, slot, status, dupOf, wo:ev.woText, part:ev.partText, time:bx.time});
  }); });
  return scans;
}
/* 刷完一顆時先分出「已刷過的正確 Wafer」（重複刷讀：只提醒、不記錄、不計入） */
/* 整顆重刷：批號和刻號與先前某一顆完全相同，且那顆全部正確 → 只是刷了兩次，只提醒、不記錄 */
function findRepeatBox(db, boxes, lot, slots){
  const key = [...slots].sort().join('/');
  const prev = boxes.find(b => !b.void && b.lot === lot && [...b.slots].sort().join('/') === key);
  if(!prev) return null;
  const row = summarize(db, boxes).boxRows.find(r => r.b === prev.b);
  return row && !row.bad.length ? prev : null;
}
/* 重新分顆後重刷：同批號、刻號落在先前某顆「有錯誤」的範圍內（例：原本 1-25 有 21-25 多出，重新分成 1-20 再刷），
   先前那顆自動作廢，由這次取代，不會再被判成刻號重複 */
function findSuperseded(db, boxes, lot, slots){
  const rows = summarize(db, boxes).boxRows;
  return boxes.filter(b => !b.void && b.lot === lot && slots.every(sl => b.slots.includes(sl))
    && (rows.find(r => r.b === b.b) || {bad:[]}).bad.length);
}
function voidBoxes(list, byB, why){ list.forEach(b => { b.void = true; b.voidBy = byB || null; b.voidWhy = why || ''; }); }

function nowText(){ const d = new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }

  scans.forEach(s => { if(s.status === 'ok') get(s.part).actual++; else if(REMOVE.includes(s.status)) get(s.part || '（不明料號）'); });

  const lotMap = new Map();   // key 料號|批號
  const lotOf = (part, lot) => { const k = part + '|' + lot; if(!lotMap.has(k)) lotMap.set(k, {part, lot, expected:0, actual:0, missing:[], extra:[]}); return lotMap.get(k); };
  db.need.forEach((n, k) => { const L = lotOf(n.part, n.lot); L.expected++; if(!okKeys.has(k)) L.missing.push(n.slot); });
  scans.forEach(s => {
    if(s.status === 'dup') return;

    else missMap.set(k, {wo:r.wo, part:r.part, lot:r.lot, fab:r.fab, slots:miss, all, need:[...r.slots].sort()});
  });

      note:`QTY ${bx.qty}，WF ID ${bx.slots.length} 片`});

    const ss = scans.filter(s => s.b === bx.b);

  });
  const ok = okCount(scans);
  // 結算錯誤詳細清單（同批號同原因合併成一列）
  const groupBy = (list, keyFn) => { const m = new Map(); list.forEach(x => { const k = keyFn(x); if(!m.has(k)) m.set(k, {...x, slots:[], bs:[]}); m.get(k).slots.push(x.slot); m.get(k).bs.push(x.b); }); return [...m.values()].map(g => ({...g, slots:[...new Set(g.slots)].sort(), bs:[...new Set(g.bs)].sort((a,b) => a - b)})); };
  // 各批號：工單實際需出刻號（有效工單）/ 已刷到正確刻號，給錯誤清單說明用
  const lotNeed = new Map(), lotGot = new Map(), push = (m, k, v) => { if(!m.has(k)) m.set(k, new Set()); m.get(k).add(v); };
  db.records.forEach(r => r.slots.forEach(sl => push(lotNeed, r.lot, sl)));
  scans.forEach(s => { if(s.status === 'ok') push(lotGot, s.lot, s.slot); });
  const asList = (m, k) => [...(m.get(k) || [])].sort();
  const issues = {
    nolot:  groupBy(scans.filter(s => s.status === 'nolot'), s => s.lot),
    extra:  groupBy(scans.filter(s => s.status === 'noslot' || s.status === 'cancelled'), s => s.status + '|' + s.lot + '|' + s.wo),
    overlap: groupBy(scans.filter(s => s.status === 'overlap'), s => s.lot + '|' + s.b + '|' + s.dupOf),
    short:  missing.filter(m => !m.all),
    unscanned: missing.filter(m => m.all),
    dup:    []
  };
  // 同一片問題 Wafer 重複刷到只算一次
  const removed = new Set(scans.filter(s => REMOVE.includes(s.status)).map(s => s.lot + '|' + s.slot)).size;
  return {scans, total:countedCount(scans), ok, removed, issues, expected:db.expected, partRows, missing, errors, boxRows,
          lotNeed:lot => asList(lotNeed, lot), lotGot:lot => asList(lotGot, lot),
          cancelWo:lot => [...new Set((db.byLotCancel.get(lot) || []).map(r => r.wo))],
          complete: ok >= db.expected && db.expected > 0};
}
function orderProgress(db, scans){
  return db.records.map(r => {
    const okKeys = new Set(scans.filter(s => s.status === 'ok').map(s => s.lot + '|' + s.slot));
    const got = new Set(r.slots.filter(sl => okKeys.has(r.lot + '|' + sl)));
    return {...r, done:got.size, got};
  });
}

function boxReport(sm, b){
  const row = sm.boxRows.find(x => x.b === b);
  const groups = {};
  row.bad.forEach(s => { (groups[s.status] = groups[s.status] || []).push(s); });
  return {row, groups};
}

/* ---------- 音效 / 震動 ---------- */
let _ac = null;
const SOUND = {sound:true, vibrate:true};
/* iPhone / Android 的瀏覽器規定：聲音要先經過一次使用者點擊才能播放。
   第一次點畫面時先「解鎖」音效；iPhone 另外設定成播放模式，靜音開關打開時也能出聲（iOS 17 以上） */
function audioCtx(){
  if(!_ac){ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; _ac = new AC(); }
  if(_ac.state !== 'running') _ac.resume().catch(() => {});
  return _ac;
}
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
  try{
    const ac = audioCtx(); if(!ac) return;
    const b = ac.createBuffer(1, 1, 22050), src = ac.createBufferSource();
    src.buffer = b; src.connect(ac.destination); src.start(0);
  }catch(e){}
}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, {capture:true, passive:true}));

/* iPhone 的 Safari 不支援網頁震動（navigator.vibrate）。
   iOS 18 以上切換「switch 開關」時會有觸覺回饋，借用它來震動（較舊的 iOS 沒有效果） */
let _hapticLabel = null;
function iosHaptic(times){
  try{
    if(!_hapticLabel){
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.setAttribute('switch', ''); inp.id = '__haptic';
      const lb = document.createElement('label'); lb.htmlFor = '__haptic';
      [inp, lb].forEach(el => { el.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none'; document.body.appendChild(el); });
      _hapticLabel = lb;
    }
    for(let k=0;k<times;k++) setTimeout(() => _hapticLabel.click(), k * 120);
  }catch(e){}
}
function vibrate(kind){
  const pat = kind === 'warn' ? [150, 80, 150] : kind === 'done' ? [100, 60, 100, 60, 300] : [400];
  try{ if(navigator.vibrate && navigator.vibrate(pat)) return; }catch(e){}
  if(/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) iosHaptic(kind === 'warn' ? 2 : 3);
}
/* ok：成功（兩聲高音，不震動）；warn：提醒（兩聲 + 震動）；err：錯誤（低沉長音 + 震動）；done：全部完成（上揚四音 + 震動） */
const TONES = {
  ok:   {type:'square',   gain:.55, seq:[[1760,.07],[0,.03],[2350,.10]]},
  warn: {type:'square',   gain:.7,  seq:[[880,.16],[0,.06],[880,.16]]},
  err:  {type:'sawtooth', gain:.8,  seq:[[330,.22],[0,.05],[220,.45]]},
  done: {type:'square',   gain:.6,  seq:[[1047,.12],[1319,.12],[1568,.12],[2093,.35]]}
};
function beep(kind){
  const T = TONES[kind] || TONES.ok;
  if(SOUND.sound) try{
    const ac = audioCtx();
    if(ac){
      // 經過壓縮器把音量推到最大又不破音
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 6; comp.connect(ac.destination);
      let t = ac.currentTime + 0.01;
      T.seq.forEach(([f,d]) => {
        if(f){ const o = ac.createOscillator(), g = ac.createGain();
          o.type = T.type; o.frequency.value = f;
          g.gain.setValueAtTime(T.gain, t); g.gain.setValueAtTime(T.gain, t + d * .7); g.gain.exponentialRampToValueAtTime(.001, t + d);
          o.connect(g); g.connect(comp); o.start(t); o.stop(t + d + .02); }
        t += d;
      });
    }
  }catch(e){}
  if(SOUND.vibrate && kind !== 'ok') vibrate(kind);
}

const CRC_T = (() => { const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c = 0xFFFFFFFF; for(let i=0;i<b.length;i++) c = CRC_T[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(entries){
  const enc = new TextEncoder(), chunks = [], central = []; let off = 0;
  entries.forEach(e => {
    const nm = enc.encode(e.name), d = e.data, crc = crc32(d);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true);
    h.setUint32(14,crc,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true);
    chunks.push(new Uint8Array(h.buffer), nm, d);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true); c.setUint32(20,d.length,true); c.setUint32(24,d.length,true);
    c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + d.length;
  });
  const cs = central.reduce((a,b)=>a+b.length,0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,entries.length,true); end.setUint16(10,entries.length,true);
  end.setUint32(12,cs,true); end.setUint32(16,off,true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xmlEsc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
function colName(n){ let s=''; n++; while(n){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }

function buildXlsx(sheets){

    f('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`),
    f('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`),
    f('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFDDEBF7"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`)
  ];
  sheets.forEach((s,i) => entries.push(f(`xl/worksheets/sheet${i+1}.xml`, sheetXml(s))));

}

/* 某份清單（廠商＋日期）的工單完成進度：共幾筆、完成幾筆（該項次的刻號全部正確刷到才算完成） */
function groupProgress(files, key, vBoxes){
  const db = buildDb(vFiles(files, key)), scans = deriveScans(db, vBoxes || []);
  const prog = orderProgress(db, scans);
  return {total:prog.length, done:prog.filter(r => r.slots.length && r.done === r.slots.length).length, started:!!(vBoxes && vBoxes.length)};
}
function progText(p){ return p.total && p.done === p.total ? `${p.total}筆／全部完成 ✔` : `${p.total}筆／完成${p.done}筆`; }
/* 批次取消：輸入工單號（R026A00656）或末三碼（656），取消該工單底下全部項次 */
function findCancelTargets(files, text){
  const tokens = String(text || '').split(/[,，\s]+/).map(t => t.trim().toUpperCase()).filter(Boolean);
  const hits = [], nf = [], bad = [];
  tokens.forEach(t => {
    if(t.includes('-')){ bad.push(t); return; }
    let hit = false;
    files.forEach(f => f.records.forEach(r => {
      const base = String(r.wo).toUpperCase().replace(/-\d+$/, '');
      if(/^\d{3}$/.test(t) ? base.endsWith(t) : base === t){ hit = true; if(!r.cancel && !hits.some(h => h.r === r)) hits.push({r, f}); }
    }));
    if(!hit) nf.push(t);
  });
  return {hits, nf, bad};
}

function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function initDecoder(){

    }catch(e){}

  try{

  }catch(e){ wasm = false; }

/* ---------- 辨識流程 ----------

const cvSmall = document.createElement('canvas'), cvRoi = document.createElement('canvas'), cvStrip = document.createElement('canvas');
const c2d = c => c.getContext('2d', {willReadFrequently:true});

let frameNo = 0;
function grabFrame(){
  const vw = video.videoWidth, vh = video.videoHeight; if(!vw || !vh) return null;
  const f = FRAMES[settings.frame] || FRAMES.code;
  const box = cam.getBoundingClientRect(), scale = Math.max(box.width / vw, box.height / vh);
  const ox = (vw * scale - box.width) / 2, oy = (vh * scale - box.height) / 2;
  const fx = (box.width * f[0] + ox) / scale, fy = (box.height * f[1] + oy) / scale;
  const fw = box.width * f[2] / scale, fh = box.height * f[3] / scale;
  cv.width = Math.round(fw); cv.height = Math.round(fh);
  c2d(cv).drawImage(video, fx, fy, fw, fh, 0, 0, cv.width, cv.height);
  return cv;
}
function boxOf(pts){ const xs = pts.map(p => p.x), ys = pts.map(p => p.y); const x = Math.min(...xs), y = Math.min(...ys); return {x, y, w:Math.max(...xs) - x, h:Math.max(...ys) - y}; }
/* 用目前的辨識引擎讀一張圖，回傳 [{text, fmt, box}] */
async function readAll(c, bin){
  if(detector){
    const r = await detector.detect(c);
    return r.map(x => ({text:x.rawValue, fmt:x.format === 'qr_code' ? 'qr' : '1d', box:{x:x.boundingBox.x, y:x.boundingBox.y, w:x.boundingBox.width, h:x.boundingBox.height}}));
  }
  if(wasm){
    const r = await ZXingWASM.readBarcodes(c2d(c).getImageData(0, 0, c.width, c.height), bin ? {...WOPT, binarizer:bin} : WOPT);
    return r.filter(x => x.isValid !== false && x.text).map(x => { const p = x.position;
      return {text:x.text, fmt:x.format === 'QRCode' ? 'qr' : '1d', box:boxOf([p.topLeft, p.topRight, p.bottomLeft, p.bottomRight])}; });
  }
  return [];

const isLotCode = o => classifyCode(o.text, o.fmt).type === 'lot';
function addUnique(out, list){ list.forEach(o => { if(!out.some(x => x.text === o.text && x.fmt === o.fmt)) out.push(o); }); }
async function decodeFrame(){
  const full = grabFrame(); if(!full) return [];
  frameNo++;
  if(!detector && !wasm) return zx ? readZxTiles(full) : [];
  // 第 1 輪
  const sc = Math.min(1, 1800 / Math.max(full.width, full.height));
  let src = full;
  if(sc < 1){ cvSmall.width = Math.round(full.width * sc); cvSmall.height = Math.round(full.height * sc); c2d(cvSmall).drawImage(full, 0, 0, cvSmall.width, cvSmall.height); src = cvSmall; }
  const out = (await readAll(src)).map(o => ({...o, box:{x:o.box.x/sc, y:o.box.y/sc, w:o.box.w/sc, h:o.box.h/sc}}));
  if(out.some(isLotCode) || pending.lot) return out;
  // 第 2 輪：依 QR Code 位置放大條碼區（LOT NO 就在 QR Code 正上方）
  for(const q of out.filter(o => o.fmt === 'qr').slice(0, 2)){
    const s = Math.max(q.box.w, q.box.h), cx = q.box.x + q.box.w / 2, cy = q.box.y + q.box.h / 2, half = s * 2.1;
    const rx = Math.max(0, cx - half), ry = Math.max(0, cy - half);
    const rw = Math.min(full.width, cx + half) - rx, rh = Math.min(full.height, cy + half) - ry;
    if(rw < 20 || rh < 20) continue;
    // 用原始解析度裁切（實測放大反而讓細條碼變糊，所以不放大）
    cvRoi.width = Math.round(rw); cvRoi.height = Math.round(rh);
    c2d(cvRoi).drawImage(full, rx, ry, rw, rh, 0, 0, cvRoi.width, cvRoi.height);
    // 細小一維條碼：不同的黑白判斷方式（binarizer）各有擅長的畫面，輪流試
    for(const bin of BINS){ addUnique(out, (await readAll(cvRoi, bin)).filter(o => o.fmt !== 'qr')); if(out.some(isLotCode) || detector) break; }
    if(out.some(isLotCode)) break;

    }
    if(!out.some(isLotCode) && zx){ for(let k=0;k<2;k++){ const v = zxDecode(cvRoi, zxStrips(cvRoi.width, cvRoi.height)[zxTurnRoi++ % 24]); if(v && v.fmt !== 'qr') addUnique(out, [v]); } }
    if(out.some(isLotCode)) break;
  }
  // 第 3 輪：整個框（原始解析度）切成上下重疊橫條逐條讀，LOT NO 在不同位置也讀得到
  if(!out.some(isLotCode) && (out.length || pending.wf)){
    for(let i=0;i<7 && !out.some(isLotCode);i++){
      const sh = Math.round(full.height / 4), sy = Math.round(full.height * i / 8);
      cvStrip.width = full.width; cvStrip.height = Math.min(sh, full.height - sy);
      c2d(cvStrip).drawImage(full, 0, sy, full.width, cvStrip.height, 0, 0, full.width, cvStrip.height);
      addUnique(out, (await readAll(cvStrip, BINS[(frameNo + 1) % 3])).filter(o => o.fmt !== 'qr'));
    }
    if(!out.some(isLotCode) && zx){ for(let k=0;k<2;k++){ const v = zxDecode(full, zxStrips(full.width, full.height)[zxTurn++ % 24]); if(v && v.fmt !== 'qr') addUnique(out, [v]); } }
  }

}
/* 沒有 wasm 時的備援：ZXing（JS 版）一次只讀一個條碼，輪流讀局部區塊 */
function readZxTiles(c){
  const out = [], w = c.width, h = c.height;
  const tiles = [[0,0,w/2,h],[w/2,0,w/2,h]];
  for(let i=0;i<11;i++) tiles.push([0, h*i/12, w, h/6], [w/2, h*i/12, w/2, h/6]);
  [null, tiles[zxTurn++ % tiles.length], tiles[zxTurn++ % tiles.length]].forEach(r => { const v = zxDecode(c, r); if(v) addUnique(out, [v]); });

}
let zxTurn = 0, zxTurnRoi = 0;   // 兩組各自輪流，確保每一條區塊都會輪到
function zxStrips(w, h){ const t = []; for(let i=0;i<12;i++) t.push([0, h*i/13, w, h/6.5], [w/2, h*i/13, w/2, h/6.5]); return t; }

function zxDecode(c, r){

}
function loop(){

    }

$('pauseBtn').onclick = () => cam.click();

/* 框內可能同時有 STOCK NO、ITEM NO、LOT NO、QTY、QR Code，只保留 LOT NO 與 WF ID（QR Code） */
function handleCodes(codes){
  const now = Date.now();
  // 單獨讀到的值超過 6 秒未湊齊就作廢，避免和下一張標籤錯配
  ['lot','wf'].forEach(k => { if(pending[k] && now - pending['t_' + k] > 6000) pending[k] = k === 'lot' ? '' : null; });
  let multi = false;
  if(codes.length){
    const got = {lot:new Set(), wf:new Map()};
    codes.forEach(o => { const c = classifyCode(o.text, o.fmt);
      if(c.type === 'lot') got.lot.add(c.value); else if(c.type === 'wf' && o.fmt === 'qr') got.wf.set(c.value.join('/'), c.value); });
    // 剛刷完的同一張標籤還在畫面中：在讀到不同批號或離開畫面 1.5 秒前，不再顯示它的 WF ID
    if(hold){
      if(got.lot.size && ![...got.lot].includes(hold.lot)) hold = null;
      else if(got.wf.has(hold.wf)){ got.wf.delete(hold.wf); got.lot.delete(hold.lot); hold.seen = now; }
      else if(now - hold.seen > 1500) hold = null;
    }
    multi = got.lot.size > 1 || got.wf.size > 1;
    if(got.lot.size === 1){ pending.lot = [...got.lot][0]; pending.t_lot = now; }
    if(got.wf.size === 1){ pending.wf = [...got.wf.values()][0]; pending.t_wf = now; }

    else setLast('warn', '已讀到刻號（QR Code），LOT NO 條碼較細讀不到：請再靠近一點，讓條碼區填滿框');

function commitBox(lot, slots){

  const bx = {b:boxes.length + 1, lot, slots, qty:null, time:nowText()};
  const sup = findSuperseded(db, boxes, lot, slots);
  if(sup.length) voidBoxes(sup, bx.b, '重新分顆後重刷');
  const supTail = sup.length ? `（已取代第 ${sup.map(b => b.b).join('、')} 顆）` : '';
  boxes.push(bx);

  const sm = summarize(db, boxes), {row, groups} = boxReport(sm, bx.b);

    if(sm.complete && !completedShown){ completedShown = true; setTimeout(showComplete, 300); }

  }
  flashFrame('bad'); beep(row.bad.some(s => REMOVE.includes(s.status)) ? 'err' : 'warn');

function flashFrame(c){ cam.classList.add(c); setTimeout(() => cam.classList.remove(c), 500); }
function setLast(cls, t){ const l = $('last'); l.className = 'last ' + cls; l.textContent = t; }

  $('boxSum').textContent = `${activeBoxes(boxes).length} 顆`;
  $('boxList').innerHTML = sm.boxRows.length ? sm.boxRows.slice().reverse().map(r =>
    r.void ? `<div class="row voided"><span>#${r.b}　${esc(r.lot)}　${esc(compress(r.slots))}</span><span class="tag">作廢</span></div>`
    : `<div class="row"><span>#${r.b}　${esc(r.lot)}　${esc(compress(r.slots))}</span><span>${!r.bad.length ? `<span class="tag o">${r.ok} 片</span>` : `<span class="tag c">異常 ${r.bad.length}</span>`} <button class="vbtn-s" data-void="${r.b}">作廢</button></span></div>`).join('')
    : '<div class="row muted">尚未刷讀</div>';
  // 錯誤紀錄統整：同一顆、同批號、同原因合併成一列，例如「顆1　QAH56　#06-10」
  const eg = new Map();
  sm.errors.forEach(s => { const k = s.b + '|' + s.lot + '|' + s.status; if(!eg.has(k)) eg.set(k, {b:s.b, lot:s.lot, status:s.status, slots:[]}); if(s.slot) eg.get(k).slots.push(s.slot); });
  const egs = [...eg.values()];
  $('errSum').textContent = egs.length ? `${egs.length} 筆（${sm.errors.length} 片）` : '無';
  $('errList').innerHTML = egs.length ? egs.reverse().map(g =>
    `<div class="row"><span>顆${g.b}　${esc(g.lot)}${g.slots.length ? '　#' + esc(compress([...new Set(g.slots)].sort())) : ''}</span><span class="tag ${g.status==='dup'?'w':'c'}">${STATUS_TEXT[g.status]}</span></div>`).join('')
    : '<div class="row muted">無</div>';
}

/* ---------- 視窗 ---------- */
function openSheet(kind, title, body, buttons){
  modalOpen = true;
  $('sheet').className = 'sheet ' + kind; $('sTitle').textContent = title; $('sBody').innerHTML = body; $('sFoot').innerHTML = '';
  buttons.forEach(([t, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = t;
    b.onclick = () => { if(fn && fn() === false) return; closeSheet(); }; $('sFoot').appendChild(b); });
  $('mask').classList.add('on');
}
function closeSheet(){ $('mask').classList.remove('on'); modalOpen = false; coolUntil = Date.now() + 600; }
function showComplete(){
  const sm = summarize(db, boxes);
  beep('done');
  openSheet('ok', '✔ 全部 Wafer 已刷完', `<div>實刷 <span class="big">${sm.total}</span> 片（${activeBoxes(boxes).length} 顆），應刷 ${sm.expected} 片</div><div>已取出問題片 ${sm.removed} 片</div>`,
    [['留在掃描', '', null], ['看結果', 'primary', () => { setTimeout(() => go('result'), 0); }]]);
}
/* 手動輸入：刻號可輸入 01/02/03 或 1-5,8 */
function parseManualSlots(v){
  const out = [];
  for(const part of toHalfWidth(v).split(/[\/,;，\s]+/).filter(Boolean)){
    const m = part.match(/^(\d{1,2})(?:-(\d{1,2}))?$/); if(!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a; if(a < 1 || b > 25 || a > b) return null;
    for(let i=a;i<=b;i++) out.push(pad2(i));
  }
  return out.length ? out : null;
}
$('manualBtn').onclick = () => {
  openSheet('plain', '手動輸入', `<div class="muted">標籤讀不到時使用</div>
    <div>批號 LOT NO</div><input id="mLot" maxlength="5" autocomplete="off" value="${esc(pending.lot)}">
    <div>刻號 WF ID（例：01/02/03 或 1-5,8）</div><input id="mWf" autocomplete="off" value="${esc(pending.wf ? compress(pending.wf).replace(/ /g,'') : '')}">
    <div id="mErr" style="color:var(--danger);font-size:14px"></div>`,
    [['取消', '', null], ['送出', 'primary', () => {
      const l = classifyCode($('mLot').value), w = parseManualSlots($('mWf').value);
      if(l.type !== 'lot'){ $('mErr').textContent = '批號格式錯誤（5 碼英數混合）'; return false; }
      if(!w){ $('mErr').textContent = '刻號格式錯誤（01~25）'; return false; }
      setTimeout(() => { lastKey = ''; commitBox(l.value, w); }, 0);
    }]]);
  setTimeout(() => $('mLot').focus(), 100);
};
$('switchV').onclick = () => pickVendor('切換到哪家廠商？', v => { setVendor(v); setLast('', `已切換到 ${v}`); renderScan(); });
$('boxList').addEventListener('click', e => {
  const v = e.target.closest('button[data-void]'); if(!v) return;
  e.preventDefault();
  const bx = boxes.find(b => b.b === +v.dataset.void); if(!bx) return;
  openSheet('warn', `作廢第 ${bx.b} 顆？`, `<div class="big">${esc(bx.lot)}　${esc(compress(bx.slots))}</div><div>作廢後這顆的刷讀紀錄不再計算（重新分顆、標籤重貼後要重刷時使用）。</div>`,
    [['返回', '', null], ['確認作廢', 'primary', () => { voidBoxes([bx], null, '手動作廢'); lastKey = ''; hold = null; completedShown = summarize(db, boxes).complete; persist(); setTimeout(renderScan, 0); setLast('', `已作廢第 ${bx.b} 顆，可以重新刷讀`); }]]);
});
$('clearBtn').onclick = () => {
  if(!boxes.length && !pending.lot && !pending.wf){ setLast('', '目前沒有刷讀紀錄'); return; }
  openSheet('warn', '清除此廠商刷讀紀錄？', `<div class="big">${esc(labelOf(curVendor))}</div><div>已刷 ${activeBoxes(boxes).length} 顆的紀錄會全部清除，要從第 1 顆重新刷讀（工單資料保留，其他廠商不受影響）。</div>`,
    [['返回', '', null], ['確認清除', 'primary', () => { boxes = []; pending = EMPTY(); lastKey = ''; hold = null; completedShown = false; persist(); setTimeout(renderScan, 0); setLast('', `已清除 ${labelOf(curVendor)} 的刷讀紀錄，可以重新刷讀`); }]]);
};
$('undoBtn').onclick = () => {
  if(pending.lot || pending.wf){ pending = EMPTY(); setLast('', '已清除本顆'); }
  else if(boxes.length){ const b = boxes.pop(); boxes.forEach(x => { if(x.voidBy === b.b){ x.void = false; x.voidBy = null; } }); lastKey = ''; setLast('', `已復原第 ${b.b} 顆（${b.lot}　${compress(b.slots)}）`); completedShown = summarize(db, boxes).complete; }
  persist(); renderScan();
};
$('optSound').checked = SOUND.sound; $('optVib').checked = SOUND.vibrate;
$('optSound').onchange = e => { SOUND.sound = e.target.checked; persist(); if(SOUND.sound) beep('ok'); };
$('optVib').onchange = e => { SOUND.vibrate = e.target.checked; persist(); };
$('optCam').onchange = e => { settings.cam = e.target.value; persist(); stopCam(); if(screen === 'scan') startCam(); };

/* ================= 3 結果 ================= */
/* 錯誤詳細清單匯出成 Excel：手機支援分享時直接開分享選單（Email / LINE…）寄回電腦，否則下載檔案 */
/* ---------- 進度備份 / 還原：把工單＋各廠商刷讀紀錄存成 .json 檔，換手機或誤清除時可匯回 ---------- */
async function shareOrDownload(blob, name, type){
  const file = new File([blob], name, {type});
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; } }
  catch(e){ if(e && e.name === 'AbortError') return; }
  downloadBlob(blob, name);
}
function progSummary(fs, store){
  return vendorGroups(fs).filter(g => g.active).map(g => { const p = groupProgress(fs, g.name, (store[g.name] || {}).boxes);
    const n = ((store[g.name] || {}).boxes || []).filter(b => !b.void).length; return {g, p, n}; });
}
$('bkSave').onclick = () => {
  persist();
  if(!files.length){ $('loadMsg').textContent = '目前沒有工單資料可以備份'; return; }
  const d = new Date(), stamp = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '_' + pad2(d.getHours()) + pad2(d.getMinutes());
  const data = {app:'wo-check', kind:'progress', ver:APP_VER, time:d.toLocaleString('zh-TW', {hour12:false}), files, scanStore, curVendor};
  shareOrDownload(new Blob([JSON.stringify(data)], {type:'application/json'}), `工單核對進度_${stamp}.json`, 'application/json');
  $('loadMsg').textContent = '';
};
$('bkFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  let d; try{ d = JSON.parse(await f.text()); }catch(err){ d = null; }
  if(!d || d.app !== 'wo-check' || d.kind !== 'progress' || !Array.isArray(d.files)){ $('loadMsg').textContent = `「${f.name}」不是工單核對的進度備份檔`; return; }
  const sum = progSummary(d.files, d.scanStore || {});
  openSheet('warn', '還原這份進度備份？', `<div class="muted">備份時間：${esc(d.time || '')}（${esc(d.ver || '')}）</div>
    <div class="clist">${sum.map(x => `<div>${esc(labelOf(x.g.name))}　${progText(x.p)}${x.n ? `・已刷 ${x.n} 顆` : ''}</div>`).join('')}</div>
    <div style="margin-top:6px">還原後，手機上目前的工單與刷讀紀錄會被<b>備份內容取代</b>。</div>`,
    [['返回', '', null], ['確認還原', 'primary', () => {
      files = d.files; scanStore = d.scanStore || {}; curVendor = d.curVendor || '';
      if(curVendor && !vendorGroups(files).some(g => g.name === curVendor)) curVendor = '';
      loadVendor(); lastKey = ''; hold = null; persist();
      setTimeout(() => { go('load'); const m = $('loadMsg'); m.style.color = 'var(--ok)'; m.textContent = `已還原進度（備份時間 ${d.time || ''}），可以按「開始掃描核對」繼續`; setTimeout(() => { m.style.color = ''; m.textContent = ''; }, 10000); }, 0);
    }]]);
};
async function exportErrors(){
  const sm = summarize(db, boxes), secs = issueSections(sm), g = vendorGroups(files).find(x => x.name === curVendor) || {vendor:curVendor, date:''};
  const rows = [['廠商', g.vendor], ['出貨日期', g.date || ''], ['匯出時間', new Date().toLocaleString('zh-TW', {hour12:false})],
    ['實刷 / 應刷', `${sm.total} / ${sm.expected} 片（${activeBoxes(boxes).length} 顆）`], ['已取出問題片數', sm.removed], [],
    ['類別','批號','料號','工單','刻號','片數','詳細說明']];
  let n = 0;
  secs.forEach(sec => sec.rows.forEach(r => { n++; rows.push([sec.title, r.lot, r.part, r.wo, compress(r.slots), r.slots.length, detailText(r.detail)]); }));
  if(!n) rows.push(['沒有任何錯誤']);
  const s2 = [['第幾顆','時間','批號','刻號','片數','結果']];
  sm.boxRows.forEach(r => s2.push([r.b, r.time, r.lot, compress(r.slots), r.slots.length, r.void ? (r.voidBy ? `作廢（由第 ${r.voidBy} 顆取代）` : '作廢') : r.bad.length ? `異常 ${r.bad.length} 片` : '正確']));
  const name = `錯誤清單_${fileSafe(curVendor).replace(/｜/g, "_")}_${stampText()}.xlsx`;
  const blob = buildXlsx([{name:'錯誤清單', rows, widths:[14,12,14,24,22,6,70]}, {name:'刷讀順序', rows:s2, widths:[8,10,10,24,6,22]}]);
  const file = new File([blob], name, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  downloadBlob(blob, name);
}
function renderResult(){
  document.querySelectorAll('.curV').forEach(e => e.textContent = labelOf(curVendor) || '—');
  const sm = summarize(db, boxes);
  const secs = issueSections(sm).filter(x => x.rows.length);
  $('resContent').innerHTML = verdictHtml(sm)
  + foldHtml(`各料號片數<small>${sm.partRows.some(p => p.lots.length) ? '有差異' : '全部相符'}</small>`, sm.partRows.map(p => `<div class="rrow"><div class="a"><span>${esc(p.part)}</span>
      <span class="${p.diff>0?'plus':p.diff<0?'minus':'zero'}">${p.diff===0?'相符':p.diff>0?'多 '+p.diff+' 片':'少 '+(-p.diff)+' 片'}</span></div>
      <div class="b">應刷 ${p.expected}　實刷 ${p.actual}</div>${p.lots.length ? `<div class="lots">${lotIssueHtml(p)}</div>` : ''}</div>`).join(''))
  + foldHtml(`錯誤詳細清單<small>${secs.length ? secs.length + ' 類' : '無'}</small>`, secs.length ? secs.map(sec => `<div class="rrow ihead i-${sec.key}"><div class="a"><span>${sec.title}</span><span>${sec.rows.reduce((a,r) => a + r.slots.length, 0)} 片</span></div><div class="b">${sec.note}</div></div>`
        + sec.rows.map(r => `<div class="rrow"><div class="a"><span>${esc(r.lot)}</span><span>${r.slots.length} 片</span></div>
          <div class="b">${esc(r.part)}　${esc(r.wo)}</div><div class="b">${detailHtml(r.detail)}</div></div>`).join('')).join('')
        : '<div class="none">沒有任何錯誤</div>', '', `<button class="expbtn" id="errExpBtn" type="button">匯出</button>`)
  + foldHtml(`刷讀順序<small>${activeBoxes(boxes).length} 顆</small>`, sm.boxRows.length ? sm.boxRows.map(r => `<div class="rrow">
      <div class="a"><span>#${r.b}　${esc(r.lot)}</span><span>${r.slots.length} 片${r.void ? ' <span class="tag">作廢</span>' : !r.bad.length ? '' : ` <span class="tag c">異常 ${r.bad.length}</span>`}</span></div>
      <div class="b">${r.time}　刻號 ${esc(compress(r.slots))}　${esc(r.parts)}</div></div>`).join('') : '<div class="none">尚未刷讀</div>')
  + `<button class="btn danger" id="resetBtn" style="width:100%;margin-top:4px">清除刷讀紀錄，重新核對</button>`;
  $('errExpBtn').onclick = e => { e.preventDefault(); e.stopPropagation(); exportErrors(); };
  $('resetBtn').onclick = () => { if(confirm('清除所有刷讀紀錄重新核對？（工單保留）')){ boxes = []; pending = EMPTY(); lastKey=''; completedShown = false; persist(); renderResult(); } };
}

document.addEventListener('visibilitychange', () => { if(document.hidden) stopCam(); else if(screen === 'scan') startCam(); });

/* 離線快取：在 https 網址下註冊，之後沒網路也能開啟 */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- 啟動 ---------- */
applyFrame();
renderLoad();
if(boxes.length){ go('scan'); setLast('', `已還原上次的核對進度（已刷 ${boxes.length} 顆）`); } else go('load');
})();
</script>
