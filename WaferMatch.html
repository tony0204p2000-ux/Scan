<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>WAFER 比對工具（手機版）</title>
<style>
:root{
  --bg:#14171a; --panel:#1c2024; --panel-2:#242a30; --line:#323a42;
  --ink:#e7e5df; --dim:#8f979f; --amber:#f0a838; --cyan:#2fd3c4; --red:#ef5259;
  --mono:Consolas,Menlo,"Roboto Mono",monospace;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom));touch-action:manipulation}
button{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:6px 14px;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.35}
button:active:not(:disabled){filter:brightness(1.25)}
[hidden]{display:none!important}

/* ---------- 置頂區:模式、相機、目前步驟 ---------- */
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;padding:8px 10px 6px}
.tabs button{flex:1;min-height:42px;padding:4px 2px;font-size:15px;font-weight:700;color:var(--dim);background:var(--panel)}
.tabs button.on{color:#221a08;background:var(--amber);border-color:var(--amber)}

#cam{position:relative;background:#000;overflow:hidden;height:34vh;height:34svh;min-height:220px}
#cam.held:not(.off)::after{content:"已暫停讀取\A按「下一張」繼續";white-space:pre;text-align:center;position:absolute;left:calc((100% - 96px) / 2 + 4px);top:50%;transform:translate(-50%,-50%);background:rgba(10,90,80,.94);color:#fff;font-size:15px;font-weight:700;line-height:1.5;padding:8px 14px;border-radius:10px;pointer-events:none}
#cam.off{height:auto;min-height:0;background:none;padding:2px 10px 6px}
#cam.off video,#cam.off #frame,#cam.off #guide,#cam.off .camtools{display:none}
#cam:not(.off) .camoff{display:none}
body.typing #cam:not(.off){height:0;min-height:0}
video{width:100%;height:100%;object-fit:cover;display:block}
#frame{position:absolute;border:2px solid var(--amber);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.5);pointer-events:none;transition:border-color .1s}
#frame.ok{border-color:var(--cyan);box-shadow:0 0 0 2000px rgba(10,80,70,.55)}
#frame.ng{border-color:var(--red);box-shadow:0 0 0 2000px rgba(110,25,25,.55)}
/* 相機工具直排在右側,讓直立的標籤框可以用到整個高度 */
.camtools{position:absolute;right:6px;top:6px;bottom:6px;width:84px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.camtools button{background:rgba(20,24,30,.74);border-color:rgba(255,255,255,.28);color:#fff;min-height:38px;padding:2px 4px;font-size:13px;line-height:1.2}
/* WAFER 標籤框內的對位參考線:上方 4 條一維條碼、左下 QR Code */
#guide{position:absolute;pointer-events:none}
#guide i{position:absolute;border:1.5px dashed rgba(240,168,56,.8);border-radius:3px}
#guide b{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:12px;font-weight:400;color:rgba(255,255,255,.8);white-space:nowrap}
.camtools button.on{background:var(--amber);border-color:var(--amber);color:#000}
.camoff{display:flex;gap:8px;flex-wrap:wrap}
#camstart{flex:1;min-height:52px;font-size:17px;font-weight:700;background:#1f6fa8;border-color:#1f6fa8;color:#fff}
#photo{min-height:52px;font-size:14px}
#cammsg{flex-basis:100%;font-size:13px;color:#ff8a8f;line-height:1.5}
#cammsg:empty{display:none}

#now{padding:8px 10px 10px}
.steps{display:flex;gap:5px;margin-bottom:6px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps span.done{background:var(--cyan)}
.steps span.act{background:var(--amber)}
.ask{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ask small{font-size:12px;color:var(--dim)}
.ask b{font-size:21px;color:var(--amber);letter-spacing:.02em}
#askhint{font-size:13px;color:var(--dim);margin-top:1px}
#note{min-height:22px;max-width:100%;font-size:14px;font-family:var(--mono);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
#note.ok{color:var(--cyan)} #note.bad{color:var(--red);font-weight:700} #note.warn{color:var(--amber);white-space:normal}
#mform{display:flex;gap:8px;margin-top:6px}
#minp{flex:1;min-width:0;font-family:var(--mono);font-size:17px;padding:9px 12px;color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;outline:none}
#minp:focus{border-color:var(--amber)}
#minp.bad{border-color:var(--red)}
#mform button{min-width:70px;font-weight:700}

/* ---------- 本筆資料 ---------- */
main{padding:10px;overflow-x:hidden;overflow-x:clip}
#top,main{max-width:100vw}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.cur{border-color:var(--amber)}
.card h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h2 i{font-style:normal;font-family:var(--mono);font-size:12px;width:20px;height:20px;border-radius:5px;background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center}
.card h2 em{font-style:normal;font-weight:400;font-size:13px;color:var(--dim);margin-left:auto;font-family:var(--mono)}
.kv{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:none}
.kv>span:first-child{flex:none;width:92px;font-size:13px;color:var(--dim)}
.kv>b{flex:1;min-width:0;font-family:var(--mono);font-size:17px;overflow-wrap:anywhere}
.kv>b.wait{color:var(--dim);font-weight:400;font-size:14px;font-family:var(--sans)}
.kv>u{text-decoration:none;font-family:var(--mono);font-size:13px;color:var(--cyan);flex:none}
.lbl{font-size:13px;color:var(--dim);margin:8px 0 5px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.chips>span{font-size:13px;color:var(--dim);align-self:center}
.chip{font-family:var(--mono);font-size:16px;min-height:36px;padding:3px 10px;border-radius:8px;background:var(--panel-2)}
.chip::after{content:" ×";color:var(--dim);font-size:13px}
.chip.lock::after{content:""}
.chip.ok{border-color:var(--cyan);color:var(--cyan)}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.chip.bad{border-color:var(--red);color:var(--red)}
.pair{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:16px}
.pair:first-of-type{border-top:none}
.pair b{flex:none;min-width:0;word-break:break-all}
.pair u{text-decoration:none;flex:1;min-width:64px;text-align:right;overflow-wrap:anywhere}
.pair button{min-height:36px;min-width:40px;padding:0;color:var(--dim)}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--dim)}
.sum b{font-family:var(--mono);font-size:22px;color:var(--ink);text-align:right;min-width:0;overflow-wrap:anywhere}
.sum span{flex:none;max-width:55%}
.sum b.eq{color:var(--cyan)} .sum b.ne{color:var(--amber)}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt label{display:block;font-size:13px;color:var(--dim)}
.opt label b{display:block;color:var(--ink);font-size:14px}
.opt input{width:100%;margin-top:5px;font-family:var(--mono);font-size:17px;padding:9px 10px;color:var(--ink);background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;outline:none}
.opt input:focus{border-color:var(--amber)}

/* ---------- 比對紀錄 ---------- */
.loghead{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.loghead h2{margin:0;font-size:15px;flex:1}
.loghead h2 small{font-weight:400;font-size:13px;font-family:var(--mono);color:var(--dim);margin-left:6px}
.rec{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rec.bad{border-left-color:var(--red)}
.rec header{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:3px}
.rec header b{color:var(--cyan)} .rec.bad header b{color:var(--red)}
.rec div{display:flex;gap:8px;font-size:13px;padding:1px 0}
.rec div span{flex:none;width:48%;color:var(--dim)}
.rec div u{text-decoration:none;font-family:var(--mono);word-break:break-all;flex:1;min-width:0}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:20px 0}
.foot{font-size:12px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.6}

/* ---------- 底部操作列(拇指區) ---------- */
/* 圖示按鈕(圓角正方形)集中在右側:右手拇指單手操作最順的位置 */
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px 0 12px}
#barinfo{flex:1;min-width:0;font-size:13px;line-height:1.4;color:var(--dim)}
#barinfo b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono)}
#bar .ic{flex:none;width:62px;height:62px;min-height:0;padding:0;border-radius:16px;border:2px solid var(--line);background:var(--panel-2);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bar .ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#bar .ic small{font-size:11px;line-height:1;white-space:nowrap}
#bar .ic.arm{border-color:var(--red);color:var(--red)}
#bar #bNext{background:#1f6fa8;border-color:#5aa5dc;color:#fff}
#bar #bNext svg{fill:currentColor;stroke-width:2}
#bar #bMain{background:var(--amber);border-color:#ffd38a;color:#221a08}
#bar #bMain svg{stroke-width:3}

/* ---------- 結果 ---------- */
#okflash{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(10,90,80,.93);color:#fff;opacity:0;pointer-events:none;transition:opacity .12s}
#okflash.show{opacity:1}
#okflash b{font-size:84px;line-height:1}
#okflash span{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.08em}
#okflash small{font-size:16px}
#err{position:fixed;inset:0;z-index:21;display:none;flex-direction:column;background:#3a1114;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#err.show{display:flex;animation:pulse .45s ease-out 2}
@keyframes pulse{0%{background:#b3262d}100%{background:#3a1114}}
#err h3{margin:0;font-family:var(--mono);font-size:30px;letter-spacing:.06em;color:#ff8a8f}
#err p{margin:6px 0 12px;font-size:15px;color:#f3c9cb}
#errDetail{flex:1;min-height:0;overflow:auto;background:rgba(0,0,0,.3);border-radius:12px;padding:6px 12px}
#errDetail div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);font-size:15px}
#errDetail div:first-child{border-top:none}
#errDetail span{color:#f3c9cb;flex:none;max-width:46%}
#errDetail b{font-family:var(--mono);font-size:17px;text-align:right;word-break:break-all}
#errDetail b.ok{color:var(--cyan)} #errDetail b.bad{color:#ff8a8f}
#errOk{margin-top:14px;min-height:64px;font-size:19px;font-weight:700;background:#fff;color:#3a1114;border-color:#fff}
</style>
</head>
<body>

<div id="top">
  <nav class="tabs" id="tabs">
    <button type="button" data-m="out">委外測試</button>
    <button type="button" data-m="in">廠內測試</button>
    <button type="button" data-m="ic">廠內IC</button>
  </nav>

  <div id="cam" class="off">
    <video id="video" playsinline muted autoplay></video>
    <div id="frame"></div>
    <div id="guide" hidden><i style="left:6.5%;width:86%;top:5.4%;height:10%"></i><i style="left:7.5%;width:86%;top:18.8%;height:9%"></i><i style="left:7.5%;width:45%;top:30.7%;height:10%"></i><i style="left:8.5%;width:54%;top:42.8%;height:10.5%"></i><i style="left:10%;width:56%;top:59%;height:35.6%"></i></div>
    <div class="camtools">
      <button type="button" id="shape">框</button>
      <button type="button" id="torch" hidden>手電筒</button>
      <button type="button" id="zoom" hidden>放大</button>
      <button type="button" id="camstop">關閉相機</button>
    </div>
    <div class="camoff">
      <button type="button" id="camstart">開啟相機掃描</button>
      <button type="button" id="photo">拍照讀取</button>
      <div id="cammsg"></div>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
  </div>

  <!-- 操作按鈕緊接在掃描框下方:單手拿手機時拇指按得到,也不會被下面的資料推遠 -->
  <div id="bar">
    <div id="barinfo"></div>
    <button type="button" class="ic" id="bReset" aria-label="整筆重來" title="整筆重來"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/></svg><small>重來</small></button>
    <button type="button" class="ic" id="bNext" aria-label="下一張" title="下一張" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5l9 6.5-9 6.5z"/><path d="M18.5 5.5v13"/></svg><small>下一張</small></button>
    <button type="button" class="ic" id="bMain" aria-label="完成" title="完成"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg><small id="bMainTxt">完成</small></button>
  </div>
  <div id="now">
    <div class="steps" id="steps"></div>
    <div class="ask"><small>現在掃描</small><b id="askname"></b></div>
    <div id="askhint"></div>
    <div id="note"></div>
    <form id="mform" autocomplete="off">
      <input id="minp" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" lang="en">
      <button type="submit">加入</button>
    </form>
  </div>
</div>

<main>
  <div id="data"></div>

  <div class="card" id="icopt" hidden>
    <h2>QC／工程領料數量<em>選填</em></h2>
    <div class="opt">
      <label><b>單次扣除</b>從黑箱總數扣掉
        <input id="deduct" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：10"></label>
      <label><b>單次改量</b>直接改成這個數量
        <input id="override" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例：90"></label>
    </div>
  </div>

  <div class="loghead">
    <h2>最近 3 筆比對<small id="logcount"></small></h2>
  </div>
  <div id="log"></div>
  <div class="foot" id="foot"></div>
</main>


<div id="okflash"><b>✓</b><span>CORRECT</span><small>比對相符，繼續下一筆</small></div>
<div id="err">
  <h3>✕ ERROR</h3>
  <p>資料不相符，請確認後重新掃描這一筆。</p>
  <div id="errDetail"></div>
  <button type="button" id="errOk">確認，重來這一筆</button>
</div>

<!-- ===== 條碼辨識引擎 =====
     Android(Chrome):用手機內建的條碼辨識,最快。
     iPhone(所有 iPhone 瀏覽器都是 Safari 核心)沒有內建辨識:改用 bd/ 裡的 zxing-wasm,一張畫面可同時讀出多個條碼。
     少數 Android 有內建辨識但不支援 QR/Code128(沒有 Google Play 服務):也改用 zxing-wasm。
     解碼程式放在同一個網站(bd/zxing_reader.wasm),不連外部網址。 -->
<script>
(function(){
  var nat=null; try{ nat=window.BarcodeDetector||null; }catch(e){}
  window.__NATIVE_BD=nat;
  /* 先暫時拿掉內建的,讓 polyfill 一定會安裝;稍後確認內建可用再換回來 */
  if(nat){ try{ window.BarcodeDetector=undefined; }catch(e){} }
})();
</script>
<script src="bd/barcode-detector.js"></script>
<script>
(function(){
  'use strict';
  var nat=window.__NATIVE_BD, cur=null; try{ cur=window.BarcodeDetector||null; }catch(e){}
  var poly=(window.BarcodeDetectionAPI && cur && cur!==nat)?cur:null;
  /* 庫房標籤實際用到的類型;少找幾種,每格畫面就快一些(手機內建與 zxing-wasm 都一樣) */
  var WANT=['qr_code','data_matrix','code_128','code_39','code_93'];
  var ENG=window.__ENG={native:false,poly:false};
  function limit(C,fs){ try{ C.getSupportedFormats=function(){ return Promise.resolve(WANT.filter(function(f){ return fs.indexOf(f)>=0; })); }; }catch(e){} }
  function usePoly(){
    if(!poly) return false;
    window.BarcodeDetector=poly; ENG.poly=true; limit(poly,WANT);
    var ov={locateFile:function(p,pre){ return /\.wasm$/.test(p)?new URL('bd/'+p,location.href).href:pre+p; }};
    try{ window.BarcodeDetectionAPI.prepareZXingModule({overrides:ov}); }catch(e){}
    /* 頁面開好後先在背景把解碼程式準備好,按掃描時就不用等 */
    setTimeout(function(){ try{ var r=window.BarcodeDetectionAPI.prepareZXingModule({overrides:ov,fireImmediately:true}); if(r&&r.catch) r.catch(function(){}); }catch(e){} },800);
    return true;
  }
  function useNative(){ window.BarcodeDetector=nat; }
  if(!nat){ usePoly(); window.__ENG_READY=Promise.resolve(); return; }
  window.__ENG_READY=Promise.resolve().then(function(){ return nat.getSupportedFormats(); }).then(function(fs){
    fs=fs||[];
    if(fs.indexOf('qr_code')>=0 && fs.indexOf('code_128')>=0){ useNative(); ENG.native=true; limit(nat,fs); return; }
    if(!usePoly()) useNative();
  },function(){ if(!usePoly()) useNative(); });
})();
</script>
<script src="scanner.js"></script>
<script>
(function(){
'use strict';
var PS=window.PhoneScan||null;
var $=function(id){ return document.getElementById(id); };
var UA=navigator.userAgent||'';
var IOS=/iP(hone|ad|od)/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints>1);

/* ---------- 共用小工具(比對規則與電腦版相同) ---------- */
function norm(v){ return (v||'').trim().toUpperCase(); }
function extractDigits(v){ return (v||'').replace(/[^0-9]/g,''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function isLot5(v){ return /^[A-Za-z0-9]{5}$/.test((v||'').trim()); }
/* 鏡頭讀到的 LOT NO 一定是英文+數字混合(不會是純數字或純英文),避免把 5 位數的數量條碼當成 LOT NO */
function camLot(v){ v=(v||'').trim(); return isLot5(v) && /[A-Za-z]/.test(v) && /[0-9]/.test(v); }
/* 早期標籤的刻號用 ; , ? 分隔,一律換成 / */
function normEng(v){ return (v||'').trim().replace(/[;,?；，？、\s]+/g,'/').replace(/^\/+|\/+$/g,''); }
function isEngrave(v){ return /^[0-9\/]+$/.test(normEng(v)) && /[0-9]/.test(v); }
function isQty(v){ return /^[0-9]+$/.test((v||'').trim()); }
function numTokens(v){ return (v||'').split(/[^0-9]+/).filter(function(t){ return t!==''; }); }
function sortNumeric(list){
  return list.slice().sort(function(a,b){ var na=parseInt(a,10), nb=parseInt(b,10); return na!==nb?na-nb:a.localeCompare(b); });
}
function sortAlpha(list){ return list.map(norm).sort(function(a,b){ return a.localeCompare(b); }); }
function sumQty(list){ return list.reduce(function(s,v){ return s+(parseInt(v,10)||0); },0); }
function pad(n){ return n<10?'0'+n:''+n; }
function nowStr(){ var d=new Date(); return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

/* 依數字排序後的刻號清單,保留原本的位置好讓單筆可以刪除 */
function chipList(key,list,opt){
  opt=opt||{};
  if(!list.length) return '<div class="chips"><span>'+esc(opt.empty||'尚未掃描')+'</span></div>';
  var idx=list.map(function(v,i){ return {v:v,i:i}; });
  idx.sort(opt.alpha?function(a,b){ return a.v.localeCompare(b.v); }:function(a,b){ var na=parseInt(a.v,10), nb=parseInt(b.v,10); return na!==nb?na-nb:a.v.localeCompare(b.v); });
  return '<div class="chips">'+idx.map(function(x){
    var cls=opt.cls?opt.cls(x.v):'';
    return opt.lock?'<button type="button" class="chip lock '+cls+'" disabled style="opacity:1">'+esc(x.v)+'</button>'
                   :'<button type="button" class="chip '+cls+'" data-del="'+key+':'+x.i+'">'+esc(x.v)+'</button>';
  }).join('')+'</div>';
}

/* =====================================================================
   三個比對模式。每個模式提供:
     step()    目前要掃的欄位:
                 name/hint/ex  畫面文字      max  手動輸入長度上限   num  數字鍵盤
                 key   這一步的代號(記住條碼類型用)
                 kind  'lot' LOT NO | 'eng' 刻號、WF ID | 'qty' 數量 | 其他
                 cam(text)     鏡頭讀到的條碼是不是這一步要的
                 pair          {cam, kind}:同一張標籤上「下一步」的條碼,同一格畫面讀到就一起收
                 submit(text)  → {err} | {msg} | {done}
     main()    底部主按鈕 {label,enabled,fn},不需要就回傳 null
     data()    本筆資料畫面
     del(k,i)  刪掉一筆已掃的資料
   ===================================================================== */

/* ---------- 委外測試:分貨標籤 ↔ WAFER(判斷方式同電腦版,手機改成一張一張讀) ----------
   分貨標籤:第 1 張讀 LOT NO + 刻號,第 2 張起只讀刻號 → 按「分貨完成」= 全部刻號合計
   WAFER 標籤:每張讀 LOT NO + 刻號,LOT NO 都必須和分貨標籤的 LOT NO 相同 → 按「完成並比對」
   比對:LOT NO 全部相同,而且分貨標籤刻號合計 = WAFER 刻號合計(排序後)才算正確。
   每張讀完才響一聲並暫停讀取,按「下一張」才讀下一張。 */
function modeOut(){
  var s, sig='';
  function blank(){ return {lot:'',eng:'',tl:0,te:0}; }
  function reset(){ s={phase:'lbl',lot:'',lbls:[],wfs:[],cur:blank(),held:false,readyAt:0,warnAt:0}; sig=''; }
  function list(){ return s.phase==='lbl'?s.lbls:s.wfs; }
  function who(){ return s.phase==='lbl'?'分貨標籤':'WAFER 標籤'; }
  /* 這一張需不需要讀 LOT NO:分貨標籤只有第 1 張要,WAFER 每張都要 */
  function needLot(){ return s.phase==='wf' || !s.lbls.length; }
  function eh(arr){ return arr.map(esc).join('/<wbr>'); }   /* 長串刻號只在「/」後面換行 */
  function engOf(arr){ var o=[]; arr.forEach(function(x){ o=o.concat(x.eng); }); return sortNumeric(o); }
  function complete(){
    var c=s.cur, tk=numTokens(normEng(c.eng)), L=list(), lot=needLot()?norm(c.lot):s.lot;
    s.cur=blank();
    if(!needLot() && c.lot && norm(c.lot)!==s.lot) return {err:'這張分貨標籤的 LOT NO 是 '+norm(c.lot)+'，和第 1 張的 '+s.lot+' 不同，沒有收'};
    var have=engOf(L), dup=tk.filter(function(t){ return have.indexOf(t)>=0; });
    if(dup.length===tk.length){ var k=0; L.forEach(function(x,i){ if(x.eng.indexOf(tk[0])>=0) k=i+1; }); return {soft:'這張'+who()+'已讀過（第 '+k+' 張），請換下一張'}; }
    if(dup.length) return {err:'刻號 '+dup.join('/')+' 前面的'+who()+'已經讀過，這張沒有收'};
    if(s.phase==='lbl' && !s.lbls.length) s.lot=lot;
    L.push({lot:lot,eng:tk}); s.held=true; sig='';
    var warn=(s.phase==='wf' && lot!==s.lot)?'　⚠ LOT NO 和分貨標籤 '+s.lot+' 不同':'';
    return {msg:who()+' 第 '+L.length+' 張：'+(needLot()||s.phase==='lbl'&&L.length===1?lot+'　':'')+'刻號 '+tk.join('/')+warn+'　（已暫停讀取）'};
  }
  function compare(){
    var lblEng=engOf(s.lbls), wfEng=engOf(s.wfs), wfLots=[];
    s.wfs.forEach(function(x){ if(wfLots.indexOf(x.lot)<0) wfLots.push(x.lot); });
    var badLots=wfLots.filter(function(l){ return l!==s.lot; });
    var lotMatch=s.lot!=='' && s.wfs.length>0 && !badLots.length;
    var lblLine=lblEng.join(''), wfLine=wfEng.join(''), engMatch=lblLine===wfLine && lblLine!=='';
    var miss=lblEng.filter(function(e){ return wfEng.indexOf(e)<0; }), extra=wfEng.filter(function(e){ return lblEng.indexOf(e)<0; });
    var ok=lotMatch && engMatch;
    var cells=[s.lot,lblLine,sortAlpha(s.wfs.map(function(x){ return x.lot; })).join('/'),wfLine];
    var d=[
      {label:'標籤 LOT NO',value:s.lot||'(空白)',ok:true},
      {label:'WAFER LOT NO',value:wfLots.join('/')||'(空白)',ok:lotMatch},
      {label:'標籤刻號(排序後)',value:lblEng.join(' ')||'(空白)',ok:true},
      {label:'WAFER刻號(排序後)',value:wfEng.join(' ')||'(空白)',ok:engMatch}
    ];
    if(badLots.length) d.push({label:'原因：LOT NO 不同',value:'WAFER 的 '+badLots.join('/')+' ≠ 標籤 '+s.lot,ok:false});
    if(miss.length) d.push({label:'原因：WAFER 少了刻號',value:miss.join(' '),ok:false});
    if(extra.length) d.push({label:'原因：WAFER 多了刻號',value:extra.join(' '),ok:false});
    finish(M.out,ok,cells,d);
  }
  reset();
  return {
    hasData:function(){ return s.lbls.length>0||s.wfs.length>0||!!s.cur.lot||!!s.cur.eng; },
    id:'out', name:'委外測試', pdf:'WAFER比對工具-委外測試 比對紀錄', labelMode:true,
    cols:['標籤 LOT NO','標籤刻號(排序後)','WAFER LOT NO(排序後)','WAFER刻號(排序後)'],
    reset:reset, nsteps:2, stepNo:function(){ return s.phase==='lbl'?1:2; },
    isHeld:function(){ return s.held; },
    step:function(){
      var n=list().length+(s.held?0:1);
      if(s.held) return {key:'hold',kind:'hold',name:who()+' 第 '+n+' 張已讀完',hint:'按「下一張」讀下一張'+who()+(s.phase==='lbl'?'；全部讀完按「分貨完成」開始讀 WAFER 標籤':'；全部讀完按「完成並比對」'),ex:'',
        cam:function(){ return false; }, submit:function(){ return {err:'這張已讀完，請先按「下一張」或「完成」'}; }};
      var nl=needLot();
      return {key:'cur',kind:'label',name:who()+' 第 '+n+' 張',
        hint:nl?'把框對準標籤右側的條碼與 QR Code，LOT NO 和刻號都讀到才算完成':'第 2 張起只讀刻號（QR Code），LOT NO 沿用第 1 張 '+s.lot,
        ex:(nl&&!s.cur.lot)?'LOT NO A1B23':'刻號 01/02', max:(nl&&!s.cur.lot)?5:0,
        cam:function(){ return false; },
        submit:function(t){
          if(nl && !s.cur.lot){ if(!isLot5(t)) return {err:'LOT NO 必須是 5 碼英數字'}; s.cur.lot=t.trim(); s.cur.tl=Date.now()+1e9; return {msg:'LOT NO '+norm(t)+'，接著輸入刻號',partial:true}; }
          if(!isEngrave(t)) return {err:'刻號只能是數字與「/」'};
          s.cur.eng=t; var r=complete(); if(r.soft) r={err:r.soft}; return r;
        }};
    },
    /* 鏡頭:這一格畫面讀到的條碼 → 填入目前這張的 LOT NO / 刻號 */
    scan:function(lst,now){
      if(s.held || now<s.readyAt) return;
      var c=s.cur, nl=needLot();
      if(c.lot && !c.eng && now-c.tl>4000) c.lot='';       /* 只讀到一半太久:作廢,避免和下一張配錯 */
      if(c.eng && !c.lot && nl && now-c.te>4000) c.eng='';
      var lots=lst.filter(function(x){ return camLot(x.t); });
      var e2=lst.filter(function(x){ return x.two && isEngrave(x.t); });
      var e1=lst.filter(function(x){ return !x.two && isEngrave(x.t); });
      if(lots.length){ if(norm(lots[0].t)!==norm(c.lot)) c.lot=lots[0].t; c.tl=now; }
      if(e2.length){ if(c.eng!==e2[0].t) c.eng=e2[0].t; c.te=now; pend1d=null; }
      else if(e1.length && !c.eng){
        /* 標籤上沒有刻號 QR Code 時才用一維條碼,且要連續穩定讀到 */
        var t=e1[0].t;
        if(!pend1d || pend1d.t!==t || now-pend1d.last>600) pend1d={t:t,first:now,last:now};
        else{ pend1d.last=now; if(now-pend1d.first>=600){ c.eng=t; c.te=now; pend1d=null; } }
      }
      /* 讀到刻號 QR Code 卻一直讀不到 LOT NO(細的一維條碼):提示靠近/自動放大 */
      if(nl && !c.lot && c.eng && !lots.length){ if(!lotMiss) lotMiss=now; else if(now-lotMiss>1500 && now-hintAt>4000){ hintAt=now; lotHint(); } } else lotMiss=0;
      if(c.eng && (c.lot || !nl)){
        var r=complete();
        if(r.soft){ if(now-s.warnAt>2500){ s.warnAt=now; say(r.soft,'warn',3000); } }
        else if(r.err){ beep(false); flashFrame(false); say('✕ '+r.err,'bad',5000); }
        else{ beep(true); flashFrame(true); say('✓ '+r.msg,r.msg.indexOf('⚠')>=0?'warn':'ok',6000); if(scanner) scanner.pause(true); }
        render(); return;
      }
      var g=c.lot+'|'+c.eng; if(g!==sig){ sig=g; render(); }
    },
    main:function(){
      var idle=s.held||(!s.cur.lot&&!s.cur.eng);
      if(s.phase==='lbl') return {short:'分貨完成',label:'分貨標籤 '+s.lbls.length+' 張<b>'+engOf(s.lbls).length+' 片</b>',enabled:s.lbls.length>0&&idle,fn:function(){
        s.phase='wf'; s.held=false; s.cur=blank(); s.readyAt=Date.now()+800; pend1d=null;
        if(scanner && !typing()) scanner.pause(false);
        say('分貨標籤共 '+engOf(s.lbls).length+' 片，請對準第 1 張 WAFER 標籤','ok');
      }};
      return {short:'比對',label:'WAFER '+s.wfs.length+' 張 / 分貨 '+engOf(s.lbls).length+' 片<b>'+engOf(s.wfs).length+' / '+engOf(s.lbls).length+'</b>',enabled:s.wfs.length>0&&idle,fn:compare};
    },
    next:function(){
      return {label:'下一張',enabled:s.held,fn:function(){
        s.held=false; s.cur=blank(); pend1d=null;
        if(scanner && !typing()) scanner.pause(false);
        say('請對準下一張'+who()+(needLot()?'':'（只讀刻號）'),'');
      }};
    },
    del:function(k,i){
      if(k==='cur'){ if(s.held){ list().pop(); if(!s.lbls.length) s.lot=''; s.held=false; if(scanner && !typing()) scanner.pause(false); } s.cur=blank(); pend1d=null; say('已清除，請重新讀這張',''); }
      if(k==='lbl' && s.phase==='lbl'){ s.lbls.splice(i,1); if(!s.lbls.length) s.lot=''; else s.lbls[0].lot=s.lot; }
      if(k==='wf' && s.phase==='wf'){ s.wfs.splice(i,1); }
    },
    data:function(){
      var c=s.cur, h='', n=list().length+(s.held?0:1), nl=needLot();
      var lblEng=engOf(s.lbls), wfEng=engOf(s.wfs);
      /* 目前這張 */
      h+='<div class="card cur"><h2><i>'+(s.phase==='lbl'?'1':'2')+'</i>'+who()+' 第 '+n+' 張<em>'+(s.held?'已讀完・暫停讀取':(c.lot||c.eng?'讀取中…':'等待對準'))+'</em></h2>';
      if(s.held){
        var last=list()[list().length-1], bad=s.phase==='wf'&&last.lot!==s.lot;
        h+='<div class="kv"><span>LOT NO</span><b style="color:var('+(bad?'--red':'--cyan')+')">'+esc(last.lot)+(bad?' ✕ ≠ '+esc(s.lot):' ✓')+'</b></div><div class="kv"><span>刻號</span><b style="color:var(--cyan)">'+eh(last.eng)+' ✓</b></div>';
      }else{
        h+='<div class="kv"><span>LOT NO</span>'+(!nl?'<b class="wait">沿用第 1 張 '+esc(s.lot)+'</b>':c.lot?'<b>'+esc(norm(c.lot))+' ✓</b>':'<b class="wait">尚未讀到</b>')+'</div>'+
           '<div class="kv"><span>刻號</span>'+(c.eng?'<b>'+eh(numTokens(normEng(c.eng)))+' ✓</b>':'<b class="wait">尚未讀到</b>')+'</div>';
      }
      if(s.held||c.lot||c.eng) h+='<div class="sum"><span>'+(s.held?'讀錯了？':'')+'</span><button type="button" data-del="cur:0" style="min-height:36px;font-size:14px">'+(s.held?'刪除這張重讀':'清除重讀')+'</button></div>';
      h+='</div>';
      /* 分貨標籤 */
      h+='<div class="card"><h2><i>1</i>分貨標籤<em>'+s.lbls.length+' 張・'+lblEng.length+' 片</em></h2>'+
        '<div class="kv"><span>LOT NO</span>'+(s.lot?'<b>'+esc(s.lot)+'</b>':'<b class="wait">尚未讀到</b>')+'</div>';
      s.lbls.forEach(function(x,i){ h+='<div class="pair"><b>第 '+(i+1)+' 張</b><u>'+eh(x.eng)+'</u>'+(s.phase==='lbl'?'<button type="button" data-del="lbl:'+i+'">×</button>':'')+'</div>'; });
      if(lblEng.length) h+='<div class="sum"><span>刻號合計（排序後）</span><b style="font-size:15px">'+esc(lblEng.join(' '))+'</b></div>';
      h+='</div>';
      /* WAFER 標籤 */
      if(s.phase==='wf'){
        var left=lblEng.filter(function(e){ return wfEng.indexOf(e)<0; });
        h+='<div class="card"><h2><i>2</i>WAFER 標籤<em>'+s.wfs.length+' 張・'+wfEng.length+' / '+lblEng.length+' 片</em></h2>';
        if(!s.wfs.length) h+='<div class="chips"><span>尚未讀到</span></div>';
        s.wfs.forEach(function(x,i){
          var okLot=x.lot===s.lot, okEng=x.eng.every(function(e){ return lblEng.indexOf(e)>=0; });
          h+='<div class="pair"><b style="color:var('+(okLot?'--cyan':'--red')+')">'+(i+1)+'.　'+esc(x.lot)+(okLot?'':' ✕')+'</b><u style="color:var('+(okEng?'--cyan':'--amber')+')">'+eh(x.eng)+'</u><button type="button" data-del="wf:'+i+'">×</button></div>';
        });
        h+=left.length?'<div class="sum"><span>分貨標籤上還沒讀到的刻號</span><b style="font-size:15px;color:var(--amber)">'+esc(left.join(' '))+'</b></div>'
                      :(wfEng.length?'<div class="sum"><span>分貨標籤上的刻號都讀到了</span><b class="eq">✓</b></div>':'');
        h+='</div>';
      }
      return h;
    }
  };
}

/* ---------- 廠內測試:RUN CARD ↔ WAFER ---------- */
function modeIn(){
  var s;
  function reset(){ s={ph:1,wip:'',eng:'',lot:'',wf:''}; }
  function wipPrefix(v){ v=(v||'').trim(); var i=v.indexOf('-'); return i===-1?v:v.slice(0,i); }
  function engraveNumber(v){
    v=(v||'').trim().toUpperCase();
    var i=v.indexOf('WF-'), rest=i===-1?v:v.slice(i+3), out='';
    for(var k=0;k<rest.length;k++){ var ch=rest[k]; if(ch>='A'&&ch<='Z') out+=String(ch.charCodeAt(0)-64); else if(ch>='0'&&ch<='9') out+=ch; }
    return out;
  }
  function camWip(t){ return t.indexOf('-')>=0 && t.toUpperCase().indexOf('WF')<0 && t.length<=40; }
  function camRcEng(t){ return t.toUpperCase().indexOf('WF')>=0 && t.length<=30; }
  function compare(){
    var wp=wipPrefix(s.wip), en=engraveNumber(s.eng), lotV=norm(s.lot), wd=extractDigits(s.wf);
    var lotMatch=norm(wp)===lotV && lotV!=='', idMatch=en===wd && wd!=='';
    finish(M['in'],lotMatch&&idMatch,[s.wip.trim(),s.eng.trim(),s.lot.trim(),s.wf.trim()],[
      {label:'WIP LOT 前段',value:wp,ok:true},
      {label:'LOT NO',value:lotV||'(空白)',ok:lotMatch},
      {label:'刻號轉換數字',value:en||'(空白)',ok:true},
      {label:'WF ID 數字部分',value:wd||'(空白)',ok:idMatch}
    ]);
  }
  reset();
  return {
    hasData:function(){ return !!s.wip; },
    id:'in', name:'廠內測試', pdf:'WAFER比對工具-廠內測試 比對紀錄',
    cols:['Run Card WIP LOT','Run Card 刻號','Wafer LOT NO','WF ID'],
    reset:reset, nsteps:4, stepNo:function(){ return s.ph; },
    step:function(){
      if(s.ph===1) return {key:'wip',kind:'wip',name:'Run Card WIP LOT',hint:'需含「-」，取前段比對；同一張 Run Card 上的刻號會一起讀',ex:'ABC12-01',cam:camWip,
        pair:{key:'rcEng',kind:'rcEng',cam:camRcEng},
        submit:function(t){ if(t.indexOf('-')<0) return {err:'WIP LOT 必須含「-」'}; s.wip=t; s.ph=2; return {msg:'WIP LOT '+t+'，等待刻號',partial:true}; }};
      if(s.ph===2) return {key:'rcEng',kind:'rcEng',name:'Run Card 刻號',hint:'需含「WF」，取 WF- 後段，字母轉數字',ex:'WF-A12',cam:camRcEng,
        submit:function(t){ if(t.toUpperCase().indexOf('WF')<0) return {err:'刻號必須含「WF」'}; s.eng=t; s.ph=3; return {msg:'刻號 '+t+' → '+engraveNumber(t)}; }};
      if(s.ph===3) return {key:'inLot',kind:'lot',name:'Wafer LOT NO',hint:'5 碼英數字；同一張標籤上的 WF ID 會一起讀並立即比對',ex:'A1B23',max:5,cam:camLot,
        pair:{key:'wfid',kind:'eng',cam:isEngrave},
        submit:function(t){ if(!isLot5(t)) return {err:'LOT NO 必須是 5 碼英數字'}; s.lot=t; s.ph=4; return {msg:'LOT NO '+norm(t)+'，等待 WF ID',partial:true}; }};
      return {key:'wfid',kind:'eng',name:'WF ID',hint:'只能是數字與「/」，掃到就立即比對',ex:'112',cam:isEngrave,
        submit:function(t){ t=normEng(t); if(!isEngrave(t)) return {err:'WF ID 只能是數字與「/」'}; s.wf=t; compare(); return {done:true}; }};
    },
    main:function(){ return null; },
    del:function(){},
    data:function(){
      function row(n,label,val,derived){
        return '<div class="kv"><span>'+label+'</span>'+(val?'<b>'+esc(val)+'</b>':'<b class="wait">'+(s.ph===n?'← 現在掃這個':'尚未掃描')+'</b>')+(val&&derived?'<u>'+esc(derived)+'</u>':'')+'</div>';
      }
      return '<div class="card cur"><h2><i>1</i>RUN CARD</h2>'+
        row(1,'WIP LOT',s.wip,'前段 '+wipPrefix(s.wip))+row(2,'刻號',s.eng,'→ '+engraveNumber(s.eng))+'</div>'+
        '<div class="card'+(s.ph>2?' cur':'')+'"><h2><i>2</i>WAFER</h2>'+
        row(3,'LOT NO',norm(s.lot))+row(4,'WF ID',s.wf)+'</div>';
    }
  };
}

/* ---------- 廠內IC測試比對:RUN CARD ↔ 黑箱條碼 ---------- */
function modeIC(){
  var s;
  function reset(){ s={ph:1,sub:'lot',rcLot:[],rcQty:[],bbLot:[],bbQty:[]}; $('deduct').value=''; $('override').value=''; }
  function validRc(v){ v=(v||'').trim(); var i=v.indexOf('-'); return i>0 && i<v.length-1; }
  function lotPrefix(v){ v=(v||'').trim(); var i=v.indexOf('-'); return i===-1?v:v.slice(0,i); }
  function parseBB(v){
    v=(v||'').trim();
    var m=v.match(/[^A-Za-z0-9\-]/); if(!m) return null;       /* 第一個不是英數字、也不是 "-" 的字元當分隔符號 */
    var p=v.split(m[0]); if(p.length<3) return null;
    var partNo=p[0].trim(), lot=p[1].trim(), q=p[2].trim().match(/^[0-9]+/);
    if(partNo===''||lot===''||!q) return null;
    return {partNo:partNo,lot:lot,qty:q[0]};
  }
  /* 鏡頭用的黑箱條碼判斷(比手動輸入嚴格):料號 ≥3 碼、批號 ≥3 碼、數量是數字,分隔符號不能是空白。
     外箱標籤最下方「BOX: 2 OF 3」條碼內容是「2 OF 3」,用空白分隔會被當成批號 OF,所以排除。 */
  function camBB(t){ return /^[A-Za-z0-9][A-Za-z0-9\-]{2,}([^A-Za-z0-9\-\s])[A-Za-z0-9\-]{3,}\1[0-9]+/.test((t||'').trim()); }
  function adj(){
    var d=$('deduct').value.trim(), o=$('override').value.trim();
    var hasO=o!==''&&isQty(o), dv=(d!==''&&isQty(d))?parseInt(d,10):0, sum=sumQty(s.bbQty);
    return {hasO:hasO,ov:hasO?parseInt(o,10):null,dv:dv,dRaw:d,sum:sum,after:hasO?parseInt(o,10):sum-dv};
  }
  function mismatch(expected,scanned,raw){
    var sum=sumQty(s.bbQty), rcSorted=sortAlpha(s.rcLot);
    finish(M.ic,false,[rcSorted.join('/'),String(sumQty(s.rcQty)),expected,String(sum),'0','',String(sum)],[
      {label:'先前掃描批號',value:expected,ok:true},
      {label:'本次掃描批號',value:scanned,ok:false},
      {label:'本次條碼內容',value:raw||'',ok:false}
    ]);
  }
  function compare(){
    var rcSorted=sortAlpha(s.rcLot), rcSum=sumQty(s.rcQty), bbLot=s.bbLot[0]||'', a=adj();
    var lotMatch=rcSorted.length>0 && bbLot!=='' && rcSorted.every(function(v){ return v===bbLot; });
    var qtyMatch=rcSum===a.after;
    finish(M.ic,lotMatch&&qtyMatch,[rcSorted.join('/'),String(rcSum),bbLot,String(a.sum),(!a.hasO&&a.dRaw!=='')?String(a.dv):'0',a.hasO?String(a.ov):'',String(a.after)],[
      {label:'RUN CARD批號(排序後)',value:rcSorted.join('/')||'(空白)',ok:true},
      {label:'黑箱批號',value:bbLot||'(空白)',ok:lotMatch},
      {label:'RUN CARD數量加總',value:String(rcSum),ok:true},
      {label:'黑箱原始加總',value:String(a.sum),ok:true},
      {label:a.hasO?'單次改量':'單次扣除',value:a.hasO?String(a.ov):String(a.dv),ok:true},
      {label:'黑箱最終數量',value:String(a.after),ok:qtyMatch}
    ]);
  }
  reset();
  return {
    hasData:function(){ return s.rcLot.length>0||s.bbLot.length>0; },
    id:'ic', name:'廠內IC測試比對', pdf:'廠內IC測試比對 比對紀錄',
    cols:['RUN CARD批號(排序後)','RUN CARD數量加總','黑箱批號(排序後)','黑箱原始加總','單次扣除','單次改量','黑箱最終數量'],
    reset:reset, nsteps:2, stepNo:function(){ return s.ph; },
    step:function(){
      if(s.ph===1 && s.sub==='lot') return {key:'rcLot',kind:'rcLot',name:'RUN CARD 批號',hint:'格式「批號-流水碼」，取前段；全部掃完按「RUN CARD 掃完了」',ex:'A1B23-001',
        cam:function(t){ return validRc(t) && !parseBB(t) && t.length<=40; },
        submit:function(t){ if(!validRc(t)) return {err:'批號格式需為「批號-流水碼」'}; var l=lotPrefix(t).toUpperCase(); s.rcLot.push(l); s.sub='qty'; return {msg:'RUN CARD 批號 '+l+'，等待數量',partial:true}; }};
      if(s.ph===1) return {key:'rcQty',kind:'qty',name:'RUN CARD 數量',hint:'接著掃（或輸入）這張 RUN CARD 的數量',ex:'100',num:true,cam:function(t){ return isQty(t) && t.length<=7; },
        submit:function(t){ if(!isQty(t)) return {err:'數量只能是數字'}; s.rcQty.push(t.trim()); s.sub='lot'; return {msg:'數量 '+t.trim()+'，累計 '+sumQty(s.rcQty)}; }};
      return {key:'bb',kind:'bb',name:'黑箱條碼',hint:'把橫條框對準外箱標籤上「料號?批號?數量」那一條長條碼；可連續掃多箱，掃完按「比對」',ex:'P001?A1B23?100',
        cam:camBB,
        submit:function(t){
          var p=parseBB(t); if(!p) return {err:'黑箱條碼格式不符（料號、批號、數量）'};
          var lot=p.lot.toUpperCase();
          if(s.bbLot.length>0 && lot!==s.bbLot[0]){ mismatch(s.bbLot[0],lot,t); return {done:true}; }   /* 批號和第一箱不同:立即判定錯誤 */
          s.bbLot.push(lot); s.bbQty.push(p.qty);
          return {msg:'黑箱 '+lot+' × '+p.qty+'，共 '+s.bbLot.length+' 箱'};
        }};
    },
    main:function(){
      if(s.ph===1) return {short:'掃完了',label:'RUN CARD '+s.rcLot.length+' 張<b>'+sumQty(s.rcQty)+'</b>',enabled:s.rcLot.length>0&&s.sub==='lot',fn:function(){ s.ph=2; say('RUN CARD 共 '+sumQty(s.rcQty)+'，接著掃黑箱條碼','ok'); }};
      return {short:'比對',label:'黑箱 '+s.bbLot.length+' 箱<b>'+adj().after+' / '+sumQty(s.rcQty)+'</b>',enabled:s.bbLot.length>0,fn:compare};
    },
    del:function(k,i){
      if(k==='rc'&&s.ph===1){ s.rcLot.splice(i,1); if(i<s.rcQty.length) s.rcQty.splice(i,1); s.sub=s.rcLot.length>s.rcQty.length?'qty':'lot'; }
      if(k==='bb'&&s.ph===2){ s.bbLot.splice(i,1); s.bbQty.splice(i,1); }
    },
    data:function(){
      var rcSum=sumQty(s.rcQty), a=adj(), h;
      h='<div class="card'+(s.ph===1?' cur':'')+'"><h2><i>1</i>RUN CARD<em>'+(s.rcLot.length?s.rcLot.length+' 張':'')+'</em></h2>';
      if(!s.rcLot.length) h+='<div class="chips"><span>尚未掃描批號</span></div>';
      s.rcLot.forEach(function(l,i){
        h+='<div class="pair"><b>'+esc(l)+'</b><u>'+(i<s.rcQty.length?esc(s.rcQty[i]):'<span style="color:var(--amber)">待掃數量</span>')+'</u>'+(s.ph===1?'<button type="button" data-del="rc:'+i+'">×</button>':'')+'</div>';
      });
      h+='<div class="sum"><span>RUN CARD 數量加總</span><b>'+rcSum+'</b></div></div>';
      if(s.ph===2){
        h+='<div class="card cur"><h2><i>2</i>黑箱條碼<em>'+(s.bbLot.length?s.bbLot.length+' 箱':'')+'</em></h2>';
        if(!s.bbLot.length) h+='<div class="chips"><span>尚未掃描黑箱條碼</span></div>';
        s.bbLot.forEach(function(l,i){ h+='<div class="pair"><b>'+esc(l)+'</b><u>'+esc(s.bbQty[i])+'</u><button type="button" data-del="bb:'+i+'">×</button></div>'; });
        h+='<div class="sum"><span>黑箱原始加總'+(a.hasO?'　→ 改量':(a.dv?'　− 扣除 '+a.dv:''))+'</span><b>'+a.sum+'</b></div>'+
           '<div class="sum"><span>黑箱最終數量（RUN CARD '+rcSum+'）</span><b class="'+(s.bbLot.length?(a.after===rcSum?'eq':'ne'):'')+'">'+a.after+'</b></div></div>';
      }
      return h;
    }
  };
}

var M={out:modeOut(), 'in':modeIn(), ic:modeIC()};
var cur=M.out, busy=false, logs={out:[],'in':[],ic:[]}, KEEP=3;

/* ---------- 提示音 / 震動 ----------
   iPhone:Safari 沒有震動功能,只能靠聲音與畫面;聲音必須在使用者點過畫面後才能播,
          所以第一次點畫面時就先把聲音準備好(否則鏡頭讀到時第一聲會是靜音)。
          支援的 iOS 版本會把聲音設成「播放」類型,靜音模式下錯誤提示仍聽得到。
   Android:聲音 + 震動。 */
var AC=null;
function unlockAudio(){
  try{
    if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type='playback';
  }catch(e){}
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=='running'){
      AC.resume();
      var b=AC.createBuffer(1,1,22050), src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(0);
    }
  }catch(e){}
}
['touchend','click','keydown'].forEach(function(ev){ document.addEventListener(ev,unlockAudio,true); });
function tone(f,dur,when,vol){
  try{
    if(!AC) return;
    if(AC.state==='suspended') AC.resume();
    var o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+(when||0);
    o.type='square'; o.frequency.value=f; g.gain.value=vol||.14; o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
function beep(kind){
  (window.__beeps=window.__beeps||[]).push(kind);   /* 給自動測試用 */
  try{
    if(PS) PS.beep(kind,{sound:false});
    else if(navigator.vibrate) navigator.vibrate(kind===true?60:kind==='done'?[60,50,120]:[90,60,90]);
  }catch(e){}
  if(kind===true) tone(1320,.08);
  else if(kind==='done'){ tone(1320,.08); tone(1760,.16,.11); }
  else{ tone(330,.26,0,.2); tone(330,.26,.36,.2); }
}
var noteT=0;
function say(t,cls,ms){
  var n=$('note'); n.textContent=t||''; n.className=cls||''; clearTimeout(noteT);
  if(t) noteT=setTimeout(function(){ n.textContent=''; n.className=''; },ms||4000);
}
var flashT=0;
function flashFrame(ok){ var f=$('frame'); f.className=ok?'ok':'ng'; clearTimeout(flashT); flashT=setTimeout(function(){ f.className=''; },350); }

/* ---------- 收一筆資料(相機、手動輸入、藍牙條碼槍都走這裡) ---------- */
function feed(text){
  if(busy) return null;
  var st=cur.step(); text=String(text==null?'':text).trim();
  if(!st || !text) return null;
  var r=st.submit(text)||{};
  if(r.err){ beep(false); flashFrame(false); say('✕ '+r.err,'bad',5000); var i=$('minp'); i.classList.add('bad'); setTimeout(function(){ i.classList.remove('bad'); },700); }
  else if(r.partial){ say(r.msg+'…',''); }          /* 只讀到一半:不出聲,整張讀完才響 */
  else if(!r.done){ beep(true); flashFrame(true); say('✓ '+r.msg,'ok'); }
  if(held() && scanner) scanner.pause(true);
  render();
  return r;
}
/* 空白送出(手動輸入或條碼槍只按 Enter)= 按底部主按鈕,和電腦版一樣 */
function held(){ return !!(cur.isHeld && cur.isHeld()); }
/* 相機要不要讀:比對結果顯示中、手動輸入中、這張已讀完等按鈕時都暫停 */
function syncPause(){ if(scanner) scanner.pause(busy || typing() || held()); }
function pressNext(){ var nb=cur.next&&cur.next(); if(nb && nb.enabled && !busy){ nb.fn(); render(); syncPause(); } }
function pressMain(){ var mb=cur.main(); if(mb && mb.enabled && !busy){ mb.fn(); if(!busy) render(); return true; } return false; }

/* ---------- 比對結果 ---------- */
var errCb=null, errAt=0;
function finish(mode,ok,cells,detail){
  logs[mode.id].unshift({t:nowStr(),c:cells,ok:ok});
  if(logs[mode.id].length>KEEP) logs[mode.id].length=KEEP;   /* 只留最近 3 筆,給使用者簡單確認 */
  store('wm_log_'+mode.id,logs[mode.id]);
  busy=true; if(scanner) scanner.pause(true);
  if(ok){
    beep('done'); $('okflash').classList.add('show');
    setTimeout(function(){ $('okflash').classList.remove('show'); mode.reset(); resume(); say('✓ 上一筆比對相符','ok'); },900);
  }else{
    beep(false); setTimeout(function(){ if($('err').classList.contains('show')) beep(false); },800);
    $('errDetail').innerHTML=detail.map(function(l){ return '<div><span>'+esc(l.label)+'</span><b class="'+(l.ok?'ok':'bad')+'">'+esc(l.value)+'</b></div>'; }).join('');
    $('err').classList.add('show'); errAt=Date.now();
    errCb=function(){ mode.reset(); clearSeen(); resume(); say('已清除，請重新掃描這一筆',''); };
  }

}
function resume(){ busy=false; syncPause(); render(); }
$('errOk').addEventListener('click',function(){ $('err').classList.remove('show'); var f=errCb; errCb=null; if(f) f(); });

/* ---------- 畫面 ---------- */
function render(){

  $('bMain').hidden=!mb;

function renderLog(){

  }).join(''):'<div class="empty">尚無比對紀錄</div>';

function setMode(id){

/* =====================================================================
   相機(相機與解碼由共用模組 scanner.js 負責,這裡決定「收哪一個」)
   1. 只收「目前這一步」格式相符的條碼,同一張標籤上其他條碼略過。
   2. 同一張標籤的 LOT NO 與刻號(QR Code)在同一格畫面讀到就一起收,不用分兩次對準。
   3. 刻號、數量這類純數字:QR Code 優先;只讀到純數字的一維條碼時,要連續穩定讀到一小段時間才收
      (WAFER 標籤上的 QTY 條碼也是純數字,避免誤收成刻號)。這一步曾經用 QR Code 收過,一維條碼要等更久。
   4. 防重複:同一個欄位剛收過的條碼,要離開鏡頭 HOLD 毫秒才會再收;
      換到別的欄位(例如分貨標籤掃完換掃 WAFER,兩張標籤內容一樣)只要離開鏡頭 HOLD2 毫秒。
      被擋住時畫面會提示,不會沒有反應。
   ===================================================================== */
var scanner=null, frameName='W', stale={}, lastSeen={}, lastTake=0, HOLD=2500, HOLD2=700, GAP=600, TOOLS_W=96, blocked=0;
/* 'W' = WAFER 標籤框:依標籤右側條碼區(4 條一維條碼 + 下方 QR Code)的比例,寬:高 約 2:3 */
var FRAME_CYCLE=['W','R','L','M','S','B'], W_AR=0.664;
function frameLabel(k){ return k==='W'?'標籤':(PS.FRAME_LABEL[k]||''); }
var learn2d=store('wm_learn2d')||{}, pend1d=null, lastAny=0, lotMiss=0, hintAt=0, autoZoomed=false, frameN=0;
/* 用「這一格之前」最後一次看到的時間判斷;不能用這一格本身,否則條碼一直在畫面裡就永遠不會過期 */
var prevSeen=null;
function isStale(t,now,key){ var x=stale[t]; if(!x) return false; var ls=(prevSeen && t in prevSeen)?prevSeen[t]:lastSeen[t]; return now-(ls||0)<(x.k===key?HOLD:HOLD2); }
function clearSeen(){ stale={}; lastSeen={}; pend1d=null; blocked=0; }
function digitKind(k){ return k==='eng'||k==='qty'; }
function typing(){ return document.body.classList.contains('typing'); }
function frameRect(cw,ch){
  var aw=Math.max(60,cw-TOOLS_W);              /* 右側留給相機工具 */
  if(frameName==='W'){ var h=ch*0.9, w=h*W_AR; if(w>aw*0.92){ w=aw*0.92; h=w/W_AR; } return {x:(aw-w)/2+4,y:(ch-h)/2,w:w,h:h}; }
  return PS.frameRect(frameName,aw,ch);
}
function layoutFrame(){
  if(!PS) return;
  $('shape').textContent='框：'+frameLabel(frameName);
  var c=$('cam'); if(c.classList.contains('off') || !c.clientHeight) return;
  var r=frameRect(c.clientWidth,c.clientHeight), f=$('frame').style, g=$('guide');
  f.left=r.x+'px'; f.top=r.y+'px'; f.width=r.w+'px'; f.height=r.h+'px';
  g.hidden=frameName!=='W'; g.style.left=r.x+'px'; g.style.top=r.y+'px'; g.style.width=r.w+'px'; g.style.height=r.h+'px';
}
function camMsg(t){ $('cammsg').textContent=t||''; }
function take(t,two,st){
  var now=Date.now();
  stale[t]={k:st?st.key:'',n:st?st.name:''}; lastSeen[t]=now; lastTake=now; pend1d=null; blocked=0;
  if(two && st && digitKind(st.kind) && !learn2d[cur.id+':'+st.key]){ learn2d[cur.id+':'+st.key]=1; store('wm_learn2d',learn2d); }
  return feed(t);
}
/* scanner.js 的 accept:告訴解碼器哪些是要的(內嵌解碼器找到要的就不再往下找,省時間) */
function wanted(t){
  if(busy) return false;
  t=String(t||'').trim(); var st=cur.step(), now=Date.now(); if(!st) return false;
  return (st.cam(t) && !isStale(t,now,st.key)) || (!!st.pair && st.pair.cam(t) && !isStale(t,now,st.pair.key));
}
function onCodes(ds){
  var now=Date.now(), list=[], seen={};
  ds.forEach(function(d){ var t=String(d.text||'').trim(); if(t && !seen[t]){ seen[t]=1; list.push({t:t,two:!!d.two}); } });
  if(!list.length) return;
  lastAny=now;
  prevSeen={};
  list.forEach(function(x){ prevSeen[x.t]=lastSeen[x.t]||0; lastSeen[x.t]=now; });
  try{ decide(list,now); }finally{ prevSeen=null; }
}
function decide(list,now){
  if(++frameN%300===0){ for(var k in lastSeen) if(now-lastSeen[k]>60000){ delete lastSeen[k]; delete stale[k]; } }
  if(busy || typing()) return;
  if(cur.labelMode){ cur.scan(list,now); return; }
  if(now-lastTake<GAP) return;
  var st=cur.step(); if(!st) return;

  /* 同一張標籤一次收兩個:畫面中這一步的條碼只有一個、下一步的新條碼也只有一個時才配對(避免和隔壁標籤配錯) */
  if(st.pair){
    var leads=list.filter(function(x){ return st.cam(x.t); });
    var parts=list.filter(function(x){ return st.pair.cam(x.t) && !st.cam(x.t) && !isStale(x.t,now,st.pair.key) && (x.two || !digitKind(st.pair.kind)); });
    if(leads.length===1 && parts.length===1){
      var r=take(leads[0].t,leads[0].two,st);
      if(r && !r.err && !r.done && !busy){ var st2=cur.step(); if(st2 && st2.cam(parts[0].t)) take(parts[0].t,parts[0].two,st2); }
      return;
    }
  }

  var cands=list.filter(function(x){ return st.cam(x.t) && !isStale(x.t,now,st.key); });
  if(!cands.length){
    pend1d=null;
    /* 框內只有剛收過的條碼:提示移開,不讓人以為當機 */
    var held=list.filter(function(x){ return stale[x.t] && (st.cam(x.t) || (st.pair && st.pair.cam(x.t))); })[0];
    if(held){
      if(!blocked) blocked=now;
      else if(now-blocked>1200 && now-hintAt>3500){
        hintAt=now;
        var from=stale[held.t].n, same=stale[held.t].k===st.key || (st.pair && stale[held.t].k===st.pair.key);
        say(same?'這張已收，請換下一張（同一張要移開鏡頭再對準才會重收）':'這張剛在「'+from+'」收過：要當「'+st.name+'」收，請把鏡頭移開一下再對準','warn',4000);
      }
      return;
    }
    blocked=0;
    /* 讀得到 QR Code 卻一直讀不到 LOT NO(細的一維條碼):提示靠近,有變焦的手機自動放大一次 */
    if(st.kind==='lot' && list.some(function(x){ return x.two; }) && !list.some(function(x){ return st.cam(x.t); })){
      if(!lotMiss) lotMiss=now;
      else if(now-lotMiss>1500 && now-hintAt>4000){ hintAt=now; lotHint(); }
    }else lotMiss=0;
    return;
  }
  lotMiss=0;
  var c=cands[0];
  if(digitKind(st.kind)){
    var two=cands.filter(function(x){ return x.two; })[0];
    if(two) c=two;
    /* 畫面裡有刻號格式的 QR Code(只是已掃過):旁邊的純數字一維條碼是數量,不收 */
    else if(st.kind==='eng' && list.some(function(x){ return x.two && isEngrave(x.t); })){ pend1d=null; return; }
    else{
      var need=learn2d[cur.id+':'+st.key]?1500:450;
      if(!pend1d || pend1d.t!==c.t || now-pend1d.last>600){ pend1d={t:c.t,first:now,last:now}; return; }
      pend1d.last=now;
      if(now-pend1d.first<need) return;
    }
  }
  take(c.t,c.two,st);
}
function lotHint(){
  var z=scanner&&scanner.caps().zoom;
  if(z && !autoZoomed && scanner.zoomAt()<1.5){
    autoZoomed=true;
    setZoom(Math.min(2,z.max));
    say('讀到 QR Code，LOT NO 條碼較細：已自動放大 2 倍，請保持對準','warn',5000);
  }else say(IOS?'LOT NO 條碼較細讀不到：保持 15–20 公分（太近 iPhone 對不到焦），用「放大」讓條碼變大':'LOT NO 條碼較細讀不到：靠近一點讓條碼填滿框，或按「放大」','warn',5000);
}
function setZoom(z){
  return scanner.zoom(z).then(function(v){
    v=Math.round(v*10)/10; store('wm_zoom',v);
    $('zoom').textContent=v>1.05?'放大 '+v+'x':'放大'; $('zoom').className=v>1.05?'on':'';
  });
}
/* 一直沒讀到任何條碼:依平台提示 */
setInterval(function(){
  if(!scanner || !scanner.isRunning() || busy || typing() || held()) return;
  var now=Date.now();
  if(now-lastAny>6000 && now-hintAt>12000){
    hintAt=now;
    say(IOS?'讀不到？iPhone 太近會對不到焦：離標籤 15–20 公分再按「放大」；反光就換個角度，還是不行用「拍照讀取」'
           :'讀不到？靠近一點讓條碼在框內變大，或按「放大」；反光就換個角度，還是不行用「拍照讀取」','warn',6000);
  }
},1000);

function engName(){
  if(!scanner || !scanner.isRunning()) return '';
  var e=scanner.engine();
  if(e==='native') return window.__ENG.poly?'zxing-wasm'+(IOS?'（iPhone）':''):'手機內建辨識';
  return e==='zxing'?'ZXing（備援，較慢）':'';
}
function makeScanner(){
  var poly=!!window.__ENG.poly;
  scanner=PS.create({
    video:$('video'), box:$('cam'), formats:'all', multi:false,
    /* iPhone(zxing-wasm):與內嵌解碼器每 2 格輪流,補讀模糊、對比差的條碼(與收料核對相同的設定) */
    hybrid:poly, need1d:poly?function(){ return false; }:undefined,
    frame:function(cw,ch){ return frameRect(cw,ch); },
    accept:wanted,
    onFrame:onCodes,
    onState:function(s){
      if(s==='live'){
        $('cam').classList.remove('off'); layoutFrame();
        var c=scanner.caps();
        $('torch').hidden=!c.torch; $('torch').className='';
        $('zoom').hidden=!c.zoom; $('zoom').className=''; $('zoom').textContent='放大';
        clearSeen(); lastAny=Date.now(); autoZoomed=false;
        var z=store('wm_zoom');
        if(c.zoom && z>1.05) setZoom(Math.min(z,c.zoom.max));
        syncPause();
      }
      if(s==='stopped') $('cam').classList.add('off');
      foot();
    },
    onError:function(msg,name){
      camMsg(name==='nomedia'?'這個開啟方式無法使用相機。相機掃描需要從 https 網址開啟（例如 GitHub Pages）；現在仍可用「拍照讀取」或手動輸入。':
        (name==='NotAllowedError'||name==='SecurityError')?(IOS?'相機權限被拒絕。請到「設定 → Safari → 相機」改成「允許」（或點網址列「大小」→ 網站設定），再重新整理。':'相機權限被拒絕。請點網址列左側的圖示 → 權限 → 相機 → 允許，再重新整理。'):msg);
    }
  });
}
function withScanner(fn){
  if(!PS) return;
  (window.__ENG_READY||Promise.resolve()).then(function(){ if(!scanner) makeScanner(); fn(); });
}
if(PS){
  $('camstart').addEventListener('click',function(){ camMsg(''); withScanner(function(){ scanner.start(); }); });
  $('camstop').addEventListener('click',function(){ if(scanner) scanner.stop(); });
  $('shape').addEventListener('click',function(){
    frameName=FRAME_CYCLE[(FRAME_CYCLE.indexOf(frameName)+1)%FRAME_CYCLE.length];
    store('wm_frame3_'+cur.id,frameName); layoutFrame();
  });
  $('torch').addEventListener('click',function(){ scanner.torch().then(function(on){ $('torch').className=on?'on':''; }); });
  $('zoom').addEventListener('click',function(){
    var c=scanner.caps().zoom; if(!c) return;
    var steps=[1,2,3].filter(function(z){ return z<=c.max+.01; }), now=Math.round(scanner.zoomAt());
    setZoom(steps[(steps.indexOf(now)+1)%steps.length]||1);
  });
  $('photo').addEventListener('click',function(){ $('file').value=''; $('file').click(); });
  $('file').addEventListener('change',function(){
    var f=this.files&&this.files[0]; if(!f) return;
    camMsg('解碼中…');
    withScanner(function(){
      scanner.decodeImage(f).then(function(ds){
        camMsg('');
        var st=cur.step(), list=ds.map(function(d){ return {t:String(d.text).trim(),two:!!d.two}; });
        var hit=st && list.filter(function(x){ return st.cam(x.t); });
        if(hit && hit.length){
          if(digitKind(st.kind)) hit.sort(function(a,b){ return b.two-a.two; });
          var r=take(hit[0].t,hit[0].two,st);
          /* 照片裡同一張標籤的下一個條碼也一起收 */
          var st2=cur.step();
          if(r && !r.err && !r.done && st.pair && st2){ var p=list.filter(function(x){ return x.t!==hit[0].t && st2.cam(x.t); }).sort(function(a,b){ return b.two-a.two; })[0]; if(p) take(p.t,p.two,st2); }
        }else{ beep(false); say(ds.length?'✕ 照片裡的條碼不是現在要掃的欄位':'✕ 這張照片讀不到條碼，請靠近一點再拍','bad'); }
      },function(e){ camMsg((e&&e.message)||'無法讀取這張照片'); });
    });
  });
  window.addEventListener('resize',layoutFrame);
  window.addEventListener('orientationchange',function(){ setTimeout(layoutFrame,300); });
}else{
  $('camstart').disabled=true; $('photo').disabled=true;
  camMsg('找不到共用掃描模組 scanner.js（需和這個檔案放在同一個資料夾）。目前只能手動輸入。');
}

/* ---------- 事件 ---------- */
$('tabs').addEventListener('click',function(e){ var b=e.target.closest('button[data-m]'); if(b && !busy) setMode(b.getAttribute('data-m')); });
$('mform').addEventListener('submit',function(e){
  e.preventDefault(); var i=$('minp'), v=i.value; i.value='';
  if(v.trim()==='') pressMain(); else feed(v);
});
$('minp').addEventListener('compositionend',function(){ if(/[㐀-鿿豈-﫿]/.test(this.value)){ this.value=''; say('✕ 請切換成英數輸入','bad'); } });
$('data').addEventListener('click',function(e){
  var b=e.target.closest('[data-del]'); if(!b || busy) return;
  var p=b.getAttribute('data-del').split(':'); cur.del(p[0],+p[1]); render(); syncPause();
});
$('bMain').addEventListener('click',pressMain);
['deduct','override'].forEach(function(id){
  $(id).addEventListener('input',function(){ var v=this.value.replace(/[^0-9]/g,''); if(v!==this.value) this.value=v; if(cur.id==='ic') $('data').innerHTML=cur.data(); });
});
/* 「重來」就在「下一張」旁邊:這一筆已有資料時要按兩次,避免誤觸 */
var rsArm=false, rsT=0;
$('bReset').addEventListener('click',function(){
  if(busy) return;
  var hasData=cur.hasData();
  if(hasData && !rsArm){ rsArm=true; this.classList.add('arm'); this.querySelector('small').textContent='再按一次'; var b=this; rsT=setTimeout(function(){ rsArm=false; b.classList.remove('arm'); b.querySelector('small').textContent='重來'; },3000); return; }
  clearTimeout(rsT); rsArm=false; this.classList.remove('arm'); this.querySelector('small').textContent='重來';
  cur.reset(); clearSeen(); say('已清除這一筆',''); render(); syncPause();
});
$('bNext').addEventListener('click',pressNext);

/* 手動輸入時把相機收起來並暫停掃描,鍵盤上方看得到輸入框與本筆資料 */
var typeT=0;
document.addEventListener('focusin',function(e){
  if(e.target.tagName==='INPUT' && e.target.type==='text'){ clearTimeout(typeT); document.body.classList.add('typing'); if(scanner) scanner.pause(true); }
});
document.addEventListener('focusout',function(){
  clearTimeout(typeT);
  typeT=setTimeout(function(){
    if(document.activeElement && document.activeElement.tagName==='INPUT') return;
    document.body.classList.remove('typing'); syncPause(); layoutFrame();
  },200);
});

/* 藍牙條碼槍(鍵盤模式):沒有點輸入框時也能直接掃;只按 Enter = 按主按鈕。錯誤畫面出現後 0.25 秒按 Enter = 確認 */
var kb='', kbT=0;
document.addEventListener('keydown',function(e){
  if($('err').classList.contains('show')){
    if(e.key==='Enter'){ e.preventDefault(); if(Date.now()-errAt>=250) $('errOk').click(); }
    return;
  }
  var t=e.target; if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Enter'){ e.preventDefault(); var v=kb; kb=''; if(v.trim()) feed(v); else pressMain(); return; }
  if(e.key && e.key.length===1){ kb+=e.key; clearTimeout(kbT); kbT=setTimeout(function(){ kb=''; },1500); }
});

/* ---------- 啟動 ---------- */
function foot(){
  var e=engName();
  $('foot').innerHTML='資料只留在這支手機，不會上傳'+(PS?'　・　共用掃描模組 v'+esc(PS.version):'')+(e?'<br>辨識引擎：'+esc(e):'')+
    (IOS?'<br>iPhone 建議用 Safari「加入主畫面」使用，沒網路也能開':'');
}
['out','in','ic'].forEach(function(id){ var L=store('wm_log_'+id); if(Array.isArray(L)) logs[id]=L.filter(function(r){ return r && Array.isArray(r.c); }).slice(0,KEEP); });
foot();
setMode(M[store('wm_mode')]?store('wm_mode'):'out');
/* 給自動測試與除錯用 */
window.__wm={feed:feed,codes:onCodes,mode:function(){ return cur.id; },scanner:function(){ return scanner; }};
/* 離線開啟:有網路時開過一次,之後沒網路也能開 */
try{ if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
})();
</script>
